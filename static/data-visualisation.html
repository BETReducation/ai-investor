<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Visualisation — Growth Capital Group</title>
<link rel="icon" type="image/png" href="/static/logos/Green Square.png">
<script>
  var _t = localStorage.getItem('gcg-theme') || 'light';
  localStorage.setItem('gcg-theme', _t);
  document.documentElement.setAttribute('data-theme', _t);
</script>
<link rel="stylesheet" href="/static/css/site-nav.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* PAGE */
.page-hero { padding: 100px 5% 56px; text-align: center; position: relative; overflow: hidden; background: var(--bg); }
.page-hero::before { content: ''; position: absolute; top: -10%; left: 50%; transform: translateX(-50%); width: 800px; height: 500px; background: radial-gradient(ellipse, rgba(168,85,247,0.10) 0%, transparent 65%); pointer-events: none; }
.hero-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
.section-badge { display: inline-flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #a855f7; margin-bottom: 18px; opacity: 0.85; }
.section-badge::before { content: ''; display: block; width: 18px; height: 1px; background: #a855f7; }
@media (max-width: 600px) {
  .section-badge { display: block; white-space: normal; text-align: center; }
  .section-badge::before { display: none; }
}

.hero-title { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: clamp(38px, 6vw, 68px); letter-spacing: -0.03em; line-height: 1.08; color: var(--text); margin-bottom: 20px; }
.hero-title .accent { color: #a855f7; }
.hero-sub { font-size: clamp(16px, 1.8vw, 19px); color: var(--muted); max-width: 620px; margin: 0 auto; line-height: 1.65; }
.content-section { padding: 20px 5% 20px; }
.content-inner { max-width: 1100px; margin: 0 auto; }

/* VISUALISATION GRID */
.list-loading { font-size: 14px; color: var(--muted); text-align: center; padding: 60px 20px; grid-column: 1 / -1; }
.viz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; padding: 24px 0 8px; }
.viz-card { display: block; text-decoration: none; color: inherit; border-radius: 16px; }
.viz-card:focus-visible { outline: 2px solid #a855f7; outline-offset: 4px; }
.viz-thumb { position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; background: var(--bg3); border: 1px solid var(--border2); transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s; }
.viz-card:hover .viz-thumb, .viz-card:focus-visible .viz-thumb { transform: translateY(-3px); border-color: #a855f7; box-shadow: 0 10px 28px rgba(168,85,247,0.18); }
.viz-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.viz-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 44px; color: rgba(255,255,255,0.85); }
.viz-over { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 16px; background: linear-gradient(180deg, rgba(8,10,22,0.35), rgba(8,10,22,0.92)); color: #eef0fa; font-size: 14px; line-height: 1.55; opacity: 0; transition: opacity 0.25s; }
.viz-card:hover .viz-over, .viz-card:focus-visible .viz-over { opacity: 1; }
.viz-name { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.02em; color: var(--text); margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.viz-name::after { content: '→'; color: #a855f7; opacity: 0; transform: translateX(-4px); transition: all 0.2s; }
.viz-card:hover .viz-name::after, .viz-card:focus-visible .viz-name::after { opacity: 1; transform: none; }
.viz-sub { display: none; font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 4px; }
@media (hover: none) {
  .viz-over { display: none; }
  .viz-sub { display: block; }
  .viz-name::after { opacity: 1; transform: none; }
}
@media (max-width: 560px) { .viz-grid { grid-template-columns: 1fr; } }

footer { border-top: 1px solid var(--border); padding: 48px 5%; margin-top: 40px; }
.footer-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
.footer-links { display: flex; gap: 28px; flex-wrap: wrap; }
.footer-links a { font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.2s; }
.footer-links a:hover { color: var(--text); }
.footer-copy { font-size: 12px; color: rgba(136,146,176,0.5); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<script src="/static/js/nav.js" data-logo="GCT Square.png"></script>

<div class="page-hero">
  <div class="hero-grid"></div>
  <div style="position:relative;z-index:2;animation:fadeUp 0.7s 0.1s ease both;">
    <div class="section-badge">Platform Tools</div>
    <h1 class="hero-title">Data <span class="accent">Visualisation</span></h1>
    <p class="hero-sub">A growing library of interactive charts and dashboards that turn raw market data into clear, at-a-glance insight — maintained and updated regularly.</p>
  </div>
</div>

<section class="content-section">
  <div class="content-inner">
    <div class="viz-grid" id="vizList">
      <div class="list-loading">Loading visualisations…</div>
    </div>
  </div>
</section>

<script src="/static/js/footer.js"></script>

<script>
function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
}, { threshold: 0.12 });

async function loadPages() {
  const list = document.getElementById('vizList');
  try {
    const res = await fetch('/api/dataviz/pages/overview');
    const data = await res.json();
    const pages = data.pages || [];
    if (!pages.length) {
      list.innerHTML = '<div class="list-loading">No visualisations published yet — check back soon.</div>';
      return;
    }
    list.innerHTML = pages.map(renderPageRow).join('');
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  } catch {
    list.innerHTML = '<div class="list-loading">Couldn\'t load visualisations — check your connection and try again.</div>';
  }
}

const PH_ICONS = ['📈', '🗺️', '🧭', '📊', '🔮', '🛰️', '⚖️', '🧮'];
function placeholder(slug) {
  let h = 0;
  for (const c of slug) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const hue = 235 + (h % 55); // blues through purples, in line with the page's accent
  return `<div class="viz-ph" style="background:linear-gradient(135deg,hsl(${hue} 60% 38%),hsl(${hue + 25} 65% 24%))">${PH_ICONS[h % PH_ICONS.length]}</div>`;
}

function renderPageRow(page) {
  const thumb = page.image_url ? `<img src="${esc(page.image_url)}" alt="" loading="lazy">` : placeholder(page.slug);
  const desc = page.description ? esc(page.description) : 'Open the full visualisation to explore it.';
  return `
    <a class="viz-card reveal" href="/tools/data-visualisation/${esc(page.slug)}">
      <div class="viz-thumb">${thumb}<div class="viz-over">${desc}</div></div>
      <div class="viz-name">${esc(page.label)}</div>
      <div class="viz-sub">${desc}</div>
    </a>
  `;
}

loadPages();

(async function checkAuth() {
  try {
    const res = await fetch('/api/me', { credentials: 'include' });
    if (res.ok) {
      const data = await res.json();
      if (data.authenticated && data.username) {
        const signIn = document.getElementById('navSignIn');
        if (signIn) { signIn.textContent = data.username; signIn.href = '/profile'; signIn.style.color = 'var(--green)'; signIn.style.borderColor = 'var(--green)'; }
        if (data.alpha_role) {
          const studioLink = document.getElementById('navStudioLi');
          if (studioLink) studioLink.style.display = '';
          if (['tom', 'gary'].includes(data.alpha_role)) {
            const datavizStudioLi = document.getElementById('navDatavizStudioLi');
            if (datavizStudioLi) datavizStudioLi.style.display = '';
          }
        }
      }
    }
  } catch {}
})();
// Theme toggle, mobile nav, and the nav-scroll background (incl. this
// page's arm-coloured tint) all now live solely in /static/js/nav.js —
// this used to duplicate all of it with a plain, non-arm-aware version
// that ran after nav.js's and silently overwrote it, undoing the header
// colour-match on every scroll and theme toggle. Removed rather than
// kept in sync by hand.
</script>
</body>
</html>
