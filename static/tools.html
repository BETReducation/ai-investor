<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools — Growth Capital Group</title>
<link rel="icon" type="image/png" href="/static/logos/Green Square.png">
<script>
  var _t = localStorage.getItem('gcg-theme') || 'light';
  localStorage.setItem('gcg-theme', _t);
  document.documentElement.setAttribute('data-theme', _t);
</script>
<link rel="stylesheet" href="/static/css/site-nav.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* PAGE */
.page-hero { padding: 100px 5% 24px; text-align: center; position: relative; overflow: hidden; background: var(--bg); }
.page-hero::before { content: ''; position: absolute; top: -10%; left: 50%; transform: translateX(-50%); width: 800px; height: 500px; background: radial-gradient(ellipse, rgba(148,163,184,0.12) 0%, transparent 65%); pointer-events: none; }
.hero-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
.section-badge { display: inline-flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 18px; opacity: 0.85; }
.section-badge::before { content: ''; display: block; width: 18px; height: 1px; background: var(--muted); }
@media (max-width: 600px) {
  .section-badge { display: block; white-space: normal; text-align: center; }
  .section-badge::before { display: none; }
}

.hero-title { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: clamp(38px, 6vw, 68px); letter-spacing: -0.03em; line-height: 1.08; color: var(--text); margin-bottom: 20px; }
.hero-title .accent { color: #a855f7; }
.hero-sub { font-size: clamp(16px, 1.8vw, 19px); color: var(--muted); max-width: 560px; margin: 0 auto; line-height: 1.65; }
.content-section { padding: 32px 5% 60px; }
.alt-bg { background: var(--bg2); }
.content-inner { max-width: 1100px; margin: 0 auto; }
.section-title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: clamp(28px, 3.5vw, 44px); letter-spacing: -0.03em; line-height: 1.12; color: var(--text); margin-bottom: 12px; text-align: center; }
.section-desc { font-size: 16px; color: var(--muted); max-width: 520px; line-height: 1.7; margin: 0 auto 48px; text-align: center; }
.hub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.hub-grid.cols2 { grid-template-columns: repeat(2, 1fr); max-width: 720px; margin: 0 auto; }
@media (max-width: 900px) { .hub-grid { grid-template-columns: 1fr; } .hub-grid.cols2 { grid-template-columns: 1fr; } }
.hub-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 36px 28px; text-decoration: none; display: flex; flex-direction: column; gap: 14px; transition: border-color 0.25s, background 0.25s, transform 0.25s; position: relative; overflow: hidden; }
.hub-card::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.4s; background: radial-gradient(ellipse at 30% 0%, rgba(var(--c-rgb), 0.12) 0%, transparent 60%); }
.hub-card:hover { border-color: var(--border2); transform: translateY(-4px); }
.hub-card:hover::before { opacity: 1; }
.card-title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 20px; color: var(--c); }
.card-desc { font-size: 14px; color: var(--muted); line-height: 1.65; flex: 1; }
.card-link { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: gap 0.2s; color: var(--c); }
.hub-card:hover .card-link { gap: 10px; }

.jump-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 28px; }
.jump-bar button { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; cursor: pointer; transition: all 0.15s; }
.jump-bar button:hover { color: var(--text); border-color: var(--border2); }
.jump-bar button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.tool-section { margin-bottom: 52px; --c: #94a3b8; --c-rgb: 148,163,184; scroll-margin-top: 90px; }
.tool-section-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.tool-section-head h2 { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em; color: var(--text); }
.tool-section-head h2::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 10px; }
.tool-section-head p { font-size: 14px; color: var(--muted); }
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.tile-grid.feature { grid-template-columns: repeat(3, 1fr); gap: 24px; }
@media (max-width: 900px) { .tile-grid.feature { grid-template-columns: 1fr; } }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px 22px 18px; text-decoration: none; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; transition: border-color 0.25s, transform 0.25s; }
.tile::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.4s; background: radial-gradient(ellipse at 30% 0%, rgba(var(--c-rgb), 0.14) 0%, transparent 60%); }
.tile:hover { border-color: rgba(var(--c-rgb), 0.55); transform: translateY(-3px); }
.tile:hover::before { opacity: 1; }
.tile > * { position: relative; }
.tile-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tile-title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 18px; color: var(--text); }
.tile-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--c); border: 1px solid rgba(var(--c-rgb), 0.45); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.tile-desc { font-size: 13.5px; color: var(--muted); line-height: 1.6; flex: 1; }
.tile-link { font-size: 13px; font-weight: 600; color: var(--c); transition: letter-spacing 0.2s; }
.tile:hover .tile-link { letter-spacing: 0.02em; }
.feature .tile { padding: 32px 28px 26px; border-radius: 20px; }
.feature .tile-title { font-size: 21px; }
.feature .tile-desc { font-size: 14px; }
.notify-box { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 56px 40px; text-align: center; max-width: 560px; margin: 0 auto; }
.notify-title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 26px; color: var(--text); margin-bottom: 10px; }
[data-theme="light"] .notify-title { color: #0d0f1c; }
.notify-desc { font-size: 15px; color: var(--muted); margin-bottom: 28px; line-height: 1.6; }
.notify-form { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.notify-input { flex: 1; min-width: 200px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); border-radius: 8px; padding: 11px 16px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; }
.notify-input:focus { border-color: var(--muted); }
.notify-btn { background: #94a3b8; color: #0f172a; border: none; padding: 11px 22px; border-radius: 8px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; }
.notify-btn:hover { opacity: 0.88; }
footer { border-top: 1px solid var(--border); padding: 48px 5%; }
.footer-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
.footer-links { display: flex; gap: 28px; flex-wrap: wrap; }
.footer-links a { font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.2s; }
.footer-links a:hover { color: var(--text); }
.footer-copy { font-size: 12px; color: rgba(136,146,176,0.5); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<script src="/static/js/nav.js" data-logo="GCT Square.png"></script>


<div class="page-hero">
  <div class="hero-grid"></div>
  <div style="position:relative;z-index:2;animation:fadeUp 0.7s 0.1s ease both;">
    <div class="section-badge">Platform Tools</div>
    <h1 class="hero-title">Your Trading <span class="accent">Toolkit</span></h1>
    <p class="hero-sub">Analysis tools, calculators and interactive data visualisations for every stage of your investing process.</p>
    <div class="jump-bar" id="jumpBar"></div>
  </div>
</div>

<section class="content-section">
  <div class="content-inner">
    <div id="toolSections"></div>
  </div>
</section>

<script src="/static/js/footer.js"></script>

<script>
// Rendered from the same category list that drives the nav (window.GCG_TOOL_CATEGORIES, set in nav.js).
(function () {
  var cats = (window.GCG_TOOL_CATEGORIES || []).filter(function (c) { return c.pages.length; }).slice();
  cats.push({ name: 'Data visualisation', rgb: '148,163,184', blurb: 'Interactive charts and dashboards that turn market data into at-a-glance insight.', pages: [
    ['Data Visualisation hub', '/tools/data-visualisation', 'Browse the full library of live maps, orbs and dashboards.', 'Library'],
    ['Global Heat Map', '/tools/data-visualisation/global-heat-map', 'Every major index worldwide, coloured by today\'s move.', 'Live data'],
    ['GCG Market Orbs', '/tools/data-visualisation/market-orbs', 'Markets and assets as bubbles in their own pools: gainers float, decliners sink.', 'Live data'],
    ['Gold &amp; Silver', '/tools/data-visualisation/gold-silver-ratio', 'How many ounces of silver match one ounce of gold, and how that ratio has moved.', 'Live data'],
    ['Bitcoin Dashboard', '/tools/data-visualisation/bitcoin-dashboard', 'Live price, the next halving countdown, coins left to mine and the average house priced in bitcoin.', 'Live data'],
    ['Winners League', '/tools/data-visualisation/winners-league', 'Which asset, metal or stock topped the table each year since 2010, and who is leading this one.', 'Historical'],
    ['Bull vs Bear Meter', '/tools/data-visualisation/bull-bear-meter', 'Eight market health signals blended into one reading of whether the stock market is in bull or bear territory.', 'Market signals']
  ] });
  var arrow = ' →';
  function slug(n) { return n.toLowerCase().replace(/[^a-z]+/g, '-'); }
  var host = document.getElementById('toolSections'), bar = document.getElementById('jumpBar');
  host.innerHTML = cats.map(function (c, i) {
    var feat = i === 0;
    return '<section class="tool-section reveal" id="cat-' + slug(c.name) + '" style="--c:rgb(' + c.rgb + ');--c-rgb:' + c.rgb + '">' +
      '<div class="tool-section-head"><h2>' + c.name + '</h2><p>' + c.blurb + '</p></div>' +
      '<div class="tile-grid' + (feat ? ' feature' : '') + '">' + c.pages.map(function (p) {
        return '<a class="tile" href="' + p[1] + '"><div class="tile-top"><div class="tile-title">' + p[0] + '</div><span class="tile-tag">' + p[3] + '</span></div>' +
          '<div class="tile-desc">' + p[2] + '</div><div class="tile-link">Open' + arrow + '</div></a>';
      }).join('') + '</div></section>';
  }).join('');
  bar.innerHTML = '<button type="button" class="active" data-cat="all">All</button>' + cats.map(function (c) {
    return '<button type="button" data-cat="' + slug(c.name) + '">' + c.name.replace(/ tools$/, '') + '</button>';
  }).join('');
  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    bar.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
    host.querySelectorAll('.tool-section').forEach(function (sec) {
      sec.style.display = (b.dataset.cat === 'all' || sec.id === 'cat-' + b.dataset.cat) ? '' : 'none';
    });
  });
})();
</script>
<script>
const revealEls = document.querySelectorAll('.reveal');
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
}, { threshold: 0.12 });
revealEls.forEach(el => io.observe(el));
(async function checkAuth() {
  try {
    const res = await fetch('/api/me', { credentials: 'include' });
    if (res.ok) {
      const data = await res.json();
      if (data.authenticated && data.username) {
        const signIn = document.getElementById('navSignIn');
        if (signIn) { signIn.textContent = data.username; signIn.href = '/profile'; signIn.style.color = 'var(--green)'; signIn.style.borderColor = 'var(--green)'; }
        if (data.alpha_role) {
          const studioLink = document.getElementById('navStudioLi');
          if (studioLink) studioLink.style.display = '';
          if (['tom', 'gary'].includes(data.alpha_role)) {
            const datavizStudioLi = document.getElementById('navDatavizStudioLi');
            if (datavizStudioLi) datavizStudioLi.style.display = '';
          }
        }
      }
    }
  } catch {}
})();
// Theme toggle, mobile nav, and the nav-scroll background (incl. this
// page's arm-coloured tint) all now live solely in /static/js/nav.js —
// this used to duplicate all of it with a plain, non-arm-aware version
// that ran after nav.js's and silently overwrote it, undoing the header
// colour-match on every scroll and theme toggle. Removed rather than
// kept in sync by hand.
</script>
</body>
</html>
