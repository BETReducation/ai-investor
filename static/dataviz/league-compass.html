<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GCG League and Compass</title>
<style>
:root{--navy:#0b1b2e;--panel:#10263f;--line:#1c3a5c;--teal:#2bb5a8;--gold:#d4a84b;--text:#e8eef5;--mute:#8da2b8;--g:#3ddc97;--r:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;border-radius:14px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.sub{color:var(--mute);font-size:.85rem}
.badge{font-size:.7rem;letter-spacing:.08em;padding:4px 10px;border-radius:99px;border:1px solid var(--gold);color:var(--gold);font-weight:700}
.badge.live{color:var(--teal);border-color:var(--teal)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:105px;flex:1}
.stat b{display:block;font-size:1rem}
.stat small{color:var(--mute);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em}
.up{color:var(--g)}.down{color:var(--r)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ctl input,.ctl select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:.85rem}
.ctl input{flex:1;min-width:140px}
.chips{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.chips button{background:none;border:0;color:var(--mute);padding:6px 12px;border-radius:7px;font-size:.8rem;cursor:pointer;font-weight:600}
.chips button.on{background:var(--teal);color:#06231f}
#scroll{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);position:relative}
table{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:#0d2038;color:var(--mute);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;text-align:right;padding:10px 10px;z-index:2;white-space:nowrap}
td{padding:7px 10px;text-align:right;border-top:1px solid #16314f;white-space:nowrap}
th:nth-child(1),td:nth-child(1){text-align:center;width:52px}
th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
tr:hover td{background:#14304f}
.rk{font-weight:700;color:var(--mute)}
.r1 .rk{color:#ffd24d}.r2 .rk{color:#cfd8e3}.r3 .rk{color:#d9985a}
.tk{font-weight:700}
.sec{color:var(--mute);font-size:.75rem}
.pc{position:relative;min-width:120px}
.pc i{position:absolute;left:0;top:50%;height:60%;transform:translateY(-50%);border-radius:0 4px 4px 0;opacity:.22}
.pc span{position:relative;font-weight:700}
details{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
summary{cursor:pointer;padding:12px 14px;font-weight:700;font-family:Georgia,serif;font-size:1.05rem;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--gold);transition:transform .2s}
details[open] summary::before{transform:rotate(90deg)}
summary small{color:var(--mute);font-family:system-ui,sans-serif;font-weight:400;font-size:.75rem}
.clkbody{padding:4px 14px 16px;text-align:center}
.clkbody .chips{display:inline-flex;margin-bottom:6px}
#clk{width:100%;max-width:480px;display:block;margin:4px auto}
#clk path{stroke:#0b1b2e;stroke-width:.4}
#clk path:hover{stroke:#fff;stroke-width:1.2}
#clk .lb{fill:#e8eef5;font-size:12px;font-weight:600}
#clk .arc{fill:#fff;font-weight:800;stroke:#06231f;stroke-width:3px;paint-order:stroke}
.sc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0 6px}
.sc button{background:none;border:1px solid var(--c);color:var(--c);border-radius:99px;padding:4px 10px;font-size:.72rem;font-weight:700;cursor:pointer}
.sc button.on{background:var(--c);color:#0b1b2e}
.cap{color:var(--mute);font-size:.72rem;margin:14px 0 4px;text-align:left}
#secsum{text-align:left}
.sr{display:grid;grid-template-columns:150px 1fr 74px 58px;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:.78rem}
.sr:hover,.sr.on{background:#14304f}
.sr.on{outline:1px solid var(--c)}
.sr .nm{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .nm i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.sr .bar{height:8px;border-radius:4px;background:#ff5a5a;overflow:hidden;display:block}
.sr .bar b{display:block;height:100%;background:#2ecc71}
.sr em{font-style:normal;font-weight:700}
.sr .ct,.sr .av{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:640px){.sr{grid-template-columns:128px 1fr 54px 46px;font-size:.68rem;gap:5px}}
.legend{display:flex;justify-content:center;gap:22px;font-size:.95rem;margin-top:4px}
#tip{position:fixed;pointer-events:none;background:#06111f;border:1px solid var(--gold);border-radius:8px;padding:8px 11px;font-size:.8rem;display:none;z-index:9}
.note{margin-top:8px;color:var(--mute);font-size:.7rem;line-height:1.4}
@media(max-width:640px){.hm{display:none}th,td{padding:7px 6px}.pc{min-width:90px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="sub">Best to worst performers <span id="plbl"></span> · <span id="stamp">Loading prices…</span></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span id="badge" class="badge">LOADING</span>
      <div class="chips per" id="per"><button data-p="day">Day</button><button data-p="week">Week</button><button data-p="month">Month</button><button data-p="year" class="on">Year</button></div></div>
  </header>
  <div class="stats">
    <div class="stat"><small>Advancers</small><b class="up" id="sUp">–</b></div>
    <div class="stat"><small>Decliners</small><b class="down" id="sDn">–</b></div>
    <div class="stat"><small>Median stock</small><b id="sMed">–</b></div>
    <div class="stat"><small>Best</small><b class="up" id="sBest">–</b></div>
    <div class="stat"><small>Worst</small><b class="down" id="sWorst">–</b></div>
  </div>
  <div class="ctl">
    <input id="q" type="search" placeholder="Search ticker…">
    <select id="sec"><option value="">All sectors</option></select>
    <div class="chips" id="view"><button data-v="all" class="on" id="vAll">All stocks</button><button data-v="top">Top 25</button><button data-v="bot">Bottom 25</button></div>
  </div>
  <div id="scroll">
    <table>
      <thead><tr><th>#</th><th>Ticker</th><th class="hm">Sector</th><th class="hm" id="hBase">Start price</th><th>Price</th><th>Change ($)</th><th>Change (%)</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <details id="clock" open>
    <summary>GCG Compass <small id="clkLbl"></small></summary>
    <div class="clkbody">
      <div class="chips per" id="per2"><button data-p="day">Day</button><button data-p="week">Week</button><button data-p="month">Month</button><button data-p="year" class="on">Year</button></div>
      <div class="sc" id="sc"></div>
      <svg id="clk" viewBox="0 0 460 460" role="img" aria-label="GCG Compass"></svg>
      <div class="legend"><span class="up">● <b id="cUp">–</b> up</span><span class="down">● <b id="cDn">–</b> down</span></div>
      <div class="cap">Sectors, most stocks up first · tap one to view it on the compass</div>
      <div id="secsum"></div>
    </div>
  </details>
  <div class="note" id="note"></div>
</div>
<div id="tip"></div>

<script>
const ENDPOINT = "/api/dataviz/league-compass/live", REFRESH_MS = 300000;
let UNIVERSE = {}, stocks = [], DATA = null, YEAR = new Date().getFullYear();
const PER = {
  day:{lbl:"today",hdr:"Prev. close"},
  week:{lbl:"over the past week",hdr:"1 week ago"},
  month:{lbl:"over the past month",hdr:"1 month ago"},
  year:{lbl:"since 1 January",hdr:"1 Jan price"}};

const $=id=>document.getElementById(id);
const money=v=>"$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const sgn=v=>v>0?"+":v<0?"−":"";
let rows=[], view="all", period="year", isLive=false;

function build(d){
  rows=stocks.filter(s=>d[s.sym]&&d[s.sym].base>0).map(s=>{
    const {base,last}=d[s.sym]; return {...s,base,last,chg:last-base,pct:(last/base-1)*100};
  }).sort((a,b)=>b.pct-a.pct).map((r,i)=>({...r,rank:i+1}));
  if(!rows.length){$("badge").className="badge";$("badge").textContent="UNAVAILABLE";$("stamp").textContent="Prices are unavailable right now";return}
  const up=rows.filter(r=>r.pct>0).length, med=rows[Math.floor(rows.length/2)];
  $("sUp").textContent=up; $("sDn").textContent=rows.length-up;
  $("sMed").textContent=sgn(med.pct)+Math.abs(med.pct).toFixed(1)+"%"; $("sMed").className=med.pct>=0?"up":"down";
  $("sBest").textContent=`${rows[0].sym} ${sgn(rows[0].pct)}${Math.abs(rows[0].pct).toFixed(1)}%`;
  const w=rows.at(-1); $("sWorst").textContent=`${w.sym} ${sgn(w.pct)}${Math.abs(w.pct).toFixed(1)}%`;
  $("vAll").textContent="All "+rows.length;
  $("badge").className="badge live"; $("badge").textContent="● LIVE";
  $("stamp").textContent="Updated "+new Date(DATA.updated_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  $("plbl").textContent=period==="year"?PER.year.lbl+" "+YEAR:PER[period].lbl; $("hBase").textContent=PER[period].hdr;
  $("note").textContent="Prices are about 15 minutes delayed. Latest session: "+DATA.as_of+". "+
    (period==="year"?"Starting line is the last close of the previous year. ":
     period==="day"?"Compared with the previous trading day's close. ":"Compared with the close one "+period+" ago. ")+
    "Rank is by % return; price-only, dividends excluded. Educational and historical information only, not financial advice.";
  draw(); drawClock();
}
function draw(){
  const q=$("q").value.trim().toUpperCase(), sc=$("sec").value;
  let list=rows;
  if(view==="top") list=rows.slice(0,25); else if(view==="bot") list=rows.slice(-25);
  list=list.filter(r=>(!q||r.sym.includes(q))&&(!sc||r.sector===sc));
  const max=Math.max(...rows.map(r=>Math.abs(r.pct)),1);
  $("tb").innerHTML=list.map(r=>{
    const c=r.pct>=0?"up":"down", col=r.pct>=0?"#3ddc97":"#ff6b6b", bw=Math.min(100,Math.abs(r.pct)/max*100);
    return `<tr class="${r.rank<=3?"r"+r.rank:""}"><td class="rk">${r.rank}</td><td class="tk">${r.sym}</td><td class="sec hm">${r.sector}</td>
      <td class="hm">${money(r.base)}</td><td>${money(r.last)}</td>
      <td class="${c}">${sgn(r.chg)}${money(Math.abs(r.chg))}</td>
      <td class="pc ${c}"><i style="width:${bw}%;background:${col}"></i><span>${sgn(r.pct)}${Math.abs(r.pct).toFixed(2)}%</span></td></tr>`;
  }).join("")||`<tr><td colspan="7" style="text-align:center;color:var(--mute);padding:24px">No matches</td></tr>`;
}
const SC={"Technology":"#4da3ff","Communication":"#8e7dff","Cons. Discretionary":"#ff9f43","Financials":"#f1d84b","Health Care":"#ff6fb5","Cons. Staples":"#26c6da","Energy":"#c08a5b","Industrials":"#9aa7b8","Utilities":"#5c6bc0","Real Estate":"#d05ce3","Materials":"#d4c4a8"};
let curSec="", cur=[];
function drawClock(){
  cur=curSec?rows.filter(r=>r.sector===curSec):rows;
  if(!cur.length) return;
  const col=curSec?SC[curSec]:"#d4a84b", N=cur.length, up=cur.filter(r=>r.pct>0).length, dn=N-up, cx=230, cy=230, R=165, r0=50;
  const rad=a=>a*Math.PI/180, P=(r,a)=>[(cx-r*Math.sin(rad(a))).toFixed(2),(cy-r*Math.cos(rad(a))).toFixed(2)];
  let s="";
  cur.forEach((r,i)=>{const a0=i/N*360,a1=(i+1)/N*360,A=P(r0,a0),B=P(R,a0),C=P(R,a1),D=P(r0,a1);
    s+=`<path data-i="${i}" fill="${r.pct>0?"#2ecc71":"#ff5a5a"}" d="M${A} L${B} A${R} ${R} 0 0 0 ${C} L${D} A${r0} ${r0} 0 0 1 ${A}Z"/>`});
  if(curSec) s+=`<circle cx="${cx}" cy="${cy}" r="${R+1}" fill="none" stroke="${col}" stroke-width="3"/>`;
  const M=N>200?50:N>100?20:N>40?10:5, m=M>=10?M/5:1, last=Math.floor((N-1)/M)*M;
  for(let v=0;v<N;v+=m){
    const a=v/N*360, major=v%M===0, p1=P(R+4,a), p2=P(R+(major?13:8),a);
    s+=`<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#8da2b8" stroke-width="${major?1.5:.8}"/>`;
    if(major){const t=P(R+27,a), flip=v===last&&a>340, anc=v===0?"end":(flip?"start":"middle");
      s+=`<text class="lb" x="${t[0]}" y="${t[1]}" text-anchor="${anc}" dominant-baseline="middle" dx="${v===0?-3:flip?3:0}">${v}</text>`}
  }
  const h=P(R+3,up/N*360), h0=P(r0,up/N*360);
  s+=`<line x1="${h0[0]}" y1="${h0[1]}" x2="${h[0]}" y2="${h[1]}" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r0-3}" fill="#0b1b2e" stroke="${col}" stroke-width="2"/>
      <text x="${cx}" y="${cy-3}" text-anchor="middle" dominant-baseline="middle" fill="#e8eef5" font-size="19" font-weight="800">${Math.round(up/N*100)}%</text>
      <text x="${cx}" y="${cy+15}" text-anchor="middle" fill="#8da2b8" font-size="10">UP</text>`;
  if(up) {const q=P(112,up/N*180); s+=`<text class="arc" x="${q[0]}" y="${q[1]}" text-anchor="middle" dominant-baseline="middle" font-size="26">${up}</text>`}
  if(dn) {const q=P(112,(up+dn/2)/N*360); s+=`<text class="arc" x="${q[0]}" y="${q[1]}" text-anchor="middle" dominant-baseline="middle" font-size="26">${dn}</text>`}
  $("clk").innerHTML=s; $("cUp").textContent=up; $("cDn").textContent=dn;
  $("clkLbl").textContent=(curSec||"All sectors")+" · "+PER[period].lbl+" · "+N+" stocks";
  const sm=Object.keys(UNIVERSE).map(k=>{const l=rows.filter(r=>r.sector===k);return{k,n:l.length,u:l.filter(r=>r.pct>0).length,avg:l.reduce((a,r)=>a+r.pct,0)/(l.length||1)}})
    .filter(x=>x.n).sort((a,b)=>b.u/b.n-a.u/a.n);
  $("secsum").innerHTML=sm.map(x=>`<div class="sr${x.k===curSec?" on":""}" data-s="${x.k}" style="--c:${SC[x.k]}"><span class="nm"><i></i>${x.k}</span><span class="bar"><b style="width:${x.u/x.n*100}%"></b></span><span class="ct"><em class="up">${x.u}</em> / <em class="down">${x.n-x.u}</em></span><span class="av ${x.avg>=0?"up":"down"}">${sgn(x.avg)}${Math.abs(x.avg).toFixed(1)}%</span></div>`).join("");
}
function buildSC(){$("sc").innerHTML=["",...Object.keys(UNIVERSE)].map(k=>`<button data-s="${k}" style="--c:${k?SC[k]:"#d4a84b"}" class="${k===curSec?"on":""}">${k||"All"}</button>`).join("")}
function pickSec(k){curSec=k; buildSC(); drawClock()}
$("sc").onclick=e=>{const b=e.target.closest("button"); if(b) pickSec(b.dataset.s)};
$("secsum").onclick=e=>{const r=e.target.closest(".sr"); if(r) pickSec(r.dataset.s===curSec?"":r.dataset.s)};
const tip=$("tip");
function showTip(e){const p=e.target.closest("path"); if(!p){tip.style.display="none";return}
  const i=+p.dataset.i, r=cur[i]; tip.innerHTML=`<b>#${i+1} ${r.sym}</b> <span style="color:#8da2b8">${r.sector}</span><br><span class="${r.pct>=0?"up":"down"}">${sgn(r.pct)}${Math.abs(r.pct).toFixed(2)}%</span>`;
  tip.style.display="block"; tip.style.left=Math.min(e.clientX+14,innerWidth-140)+"px"; tip.style.top=(e.clientY+14)+"px"}
$("clk").addEventListener("mousemove",showTip); $("clk").addEventListener("click",showTip); $("clk").addEventListener("mouseleave",()=>tip.style.display="none");
$("q").oninput=draw; $("sec").onchange=draw;
$("view").onclick=e=>{const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#view button").forEach(x=>x.classList.toggle("on",x===b)); view=b.dataset.v; draw(); $("scroll").scrollTop=0};
document.querySelectorAll(".per").forEach(g=>g.onclick=e=>{const b=e.target.closest("button"); if(!b||!DATA) return;
  document.querySelectorAll(".per button").forEach(x=>x.classList.toggle("on",x.dataset.p===b.dataset.p)); period=b.dataset.p; build(DATA.periods[period]);
  if(g.id==="per") $("scroll").scrollTop=0});
async function load(){
  try{
    const r=await fetch(ENDPOINT); if(!r.ok) throw 0;
    DATA=await r.json(); YEAR=DATA.year; UNIVERSE=DATA.universe;
    stocks=[]; Object.entries(UNIVERSE).forEach(([sector,l])=>l.forEach(sym=>stocks.push({sym,sector})));
    if($("sec").options.length<2) Object.keys(UNIVERSE).forEach(k=>$("sec").insertAdjacentHTML("beforeend",`<option>${k}</option>`));
    buildSC(); build(DATA.periods[period]);
  }catch(e){ if(!DATA){$("badge").className="badge";$("badge").textContent="UNAVAILABLE";$("stamp").textContent="Prices are unavailable right now"} }
}
load(); setInterval(load,REFRESH_MS);

// Tell the host page how tall to make the iframe.
function postHeight(){parent.postMessage({gcgIframeHeight:document.documentElement.scrollHeight,src:"league-compass"},location.origin);}
try{new ResizeObserver(postHeight).observe(document.body)}catch(e){}
</script>
</body>
</html>
