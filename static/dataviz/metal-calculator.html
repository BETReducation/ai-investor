<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metal Calculator</title>
<script>
  // Follow the site's light/dark toggle (same origin as the host page).
  try { var t = localStorage.getItem('gcg-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#0b1f3a;--mute:#5b6b80;--line:#dde3ea;--teal:#0f8b8d;--gold:#b8860b;--inbg:#f0f4f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1628;--card:#112240;--ink:#eef2f7;--mute:#93a4bb;--line:#223a5e;--teal:#2dc4c6;--gold:#e0b341;--inbg:#0a1628}}
:root[data-theme="dark"]{--bg:#0a1628;--card:#112240;--ink:#eef2f7;--mute:#93a4bb;--line:#223a5e;--teal:#2dc4c6;--gold:#e0b341;--inbg:#0a1628}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:4px 2px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--inbg);color:var(--ink);font-size:16px}
input:focus{outline:2px solid var(--teal);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
details summary{cursor:pointer;font-weight:600;color:var(--teal)}
details .grid{margin-top:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:300px}
th,td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;color:var(--mute)}
th{color:var(--mute);font-weight:500;border-top:0}
.tot{border-color:var(--gold)}
.big{font:700 22px Georgia,serif;color:var(--gold)}
.dw{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.dw svg{width:160px;height:160px;flex:none}
.lg{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}.lg b{margin-left:auto;padding-left:16px}
#legend{flex:1;min-width:160px}
.pers{text-align:center}.pers .lab{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}.pers .em{font-size:44px;line-height:1.2}.pers h3{margin:2px 0 4px;font:700 20px Georgia,serif}.pers p{margin:0;color:var(--mute);font-size:14px}
.live{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center}.up{color:#0fb374}.dn{color:#e5344d}
.note{font-size:12px;color:var(--mute);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<div class="card"><details>
<summary>Prices &amp; exchange rates (tap to edit)</summary>
<div class="grid" id="rates"></div>
<p class="note" id="priceNote">Loading live prices...</p>
</details></div>

<div id="metals"></div>

<div class="card"><h2>Allocation</h2><div class="dw"><svg id="donut" viewBox="0 0 120 120"></svg><div id="legend"></div></div></div>

<div class="card pers" id="pers"></div>

<div class="card tot"><h2>Total value</h2>
<div class="big" id="tot-usd">$0.00</div>
<div class="tw"><table><tbody id="tot-rows"></tbody></table></div></div>

<p class="note">Enter your weight in troy ounces or grams. The other fills in automatically. For education only, not financial advice.</p>
</div>
<script>
var OZ=31.1034768;
var M=[{k:'gold',n:'Gold',c:'#d4a017',p:4300},{k:'silver',n:'Silver',c:'#9aa5b1',p:65},{k:'platinum',n:'Platinum',c:'#6c8ea4',p:1750},{k:'palladium',n:'Palladium',c:'#8d7fb0',p:1250},{k:'copper',n:'Copper',c:'#b87333',p:0.4}];
var FX=[{k:'gbp',n:'£1 in USD',v:1.33},{k:'eur',n:'€1 in USD',v:1.16},{k:'btc',n:'₿1 in USD',v:110000}];
var P={},R={},Q={},DAY={};
function $(i){return document.getElementById(i)}
function f(n,d){return n.toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d})}
function cur(u){return[['USD','$',1,2],['GBP','£',1/R.gbp,2],['EUR','€',1/R.eur,2],['BTC','₿',1/R.btc,6]]}
function money(s,v,d){return s+f(v,d)}
function build(){
 var h='';
 M.forEach(function(m){P[m.k]=m.p;h+='<div><label>'+m.n+' ($ per troy oz)</label><input type="number" inputmode="decimal" step="any" id="p-'+m.k+'" value="'+m.p+'"></div>'});
 FX.forEach(function(x){R[x.k]=x.v;h+='<div><label>'+x.n+'</label><input type="number" inputmode="decimal" step="any" id="r-'+x.k+'" value="'+x.v+'"></div>'});
 $('rates').innerHTML=h;
 var c='';
 M.forEach(function(m){Q[m.k]=0;c+='<div class="card"><h2><span class="dot" style="background:'+m.c+'"></span>'+m.n+'</h2>'+
 '<div class="grid"><div><label>Troy oz</label><input type="number" inputmode="decimal" step="any" min="0" placeholder="0" id="q-'+m.k+'"></div>'+
 '<div><label>Grams</label><input type="number" inputmode="decimal" step="any" min="0" placeholder="0" id="gi-'+m.k+'"></div></div><div style="height:10px"></div>'+
 '<div class="tw"><table><thead><tr><th></th><th>Per gram</th><th>Value</th></tr></thead><tbody id="t-'+m.k+'"></tbody></table></div></div>'});
 $('metals').innerHTML=c;
 document.querySelectorAll('input').forEach(function(i){i.addEventListener('input',function(e){sync(e.target);upd()})});
 upd();
}
function sync(t){
 var id=t.id,k;
 if(id.indexOf('q-')==0){k=id.slice(2);var o=parseFloat(t.value);$('gi-'+k).value=isFinite(o)&&o>=0?+(o*OZ).toFixed(4):''}
 else if(id.indexOf('gi-')==0){k=id.slice(3);var g=parseFloat(t.value);$('q-'+k).value=isFinite(g)&&g>=0?+(g/OZ).toFixed(6):''}
}
function donut(V,tot){
 var Cc=2*Math.PI*46,off=0,l='',s='<circle cx="60" cy="60" r="46" fill="none" stroke="var(--line)" stroke-width="22"/>';
 M.forEach(function(m){
  var v=V[m.k]||0;
  if(tot>0&&v>0){var len=v/tot*Cc;s+='<circle cx="60" cy="60" r="46" fill="none" stroke="'+m.c+'" stroke-width="22" stroke-dasharray="'+len+' '+(Cc-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 60 60)"/>';off+=len}
  l+='<div class="lg"><span class="dot" style="background:'+m.c+'"></span>'+m.n+'<b>'+(tot>0?f(v/tot*100,1):'0.0')+'%</b></div>';
 });
 s+='<text x="60" y="64" text-anchor="middle" style="fill:var(--mute);font-size:10px">'+(tot>0?'Your stack':'Add metal')+'</text>';
 $('donut').innerHTML=s;$('legend').innerHTML=l;
}
function personality(V,tot){
 var s=function(k){return(V[k]||0)/tot},n=M.filter(function(m){return V[m.k]>0}).length,top=Math.max.apply(null,M.map(function(m){return s(m.k)}));
 if(n==1&&s('gold')==1)return['🥇','The Gold Bug','All gold, no distractions. The oldest store of value in the book.'];
 if(s('gold')>=.6)return['🥇','The Gold Bug','Gold is carrying the stack. Slow, steady and thousands of years old.'];
 if(s('silver')>=.4)return['🥈','The Silver Surfer','Silver is the wild cousin of gold: cheaper, twitchier, with a big industrial side.'];
 if(s('platinum')+s('palladium')>=.4)return['🏭','The Industrial Contrarian','Platinum and palladium sit in car catalysts and factories. Not the usual crowd.'];
 if(s('copper')>=.4)return['🔌','Dr Copper','Copper is the metal traders read for the health of the global economy.'];
 if(s('gold')+s('silver')>=.85)return['⚖️','The Classic Stacker','Gold and silver, the traditional pairing.'];
 if(n>=4&&top<.45)return['🧺','The All-Rounder','Spread across the metals with none in charge.'];
 return['🧭','The Collector','A bit of everything, still finding your style.'];
}
function livebar(V,tot){
 var chg=0,best=null;
 M.forEach(function(m){var d=DAY[m.k];if(d==null||!(V[m.k]>0))return;chg+=V[m.k]-V[m.k]/(1+d/100);if(!best||Math.abs(d)>Math.abs(best[1]))best=[m.n,d]});
 var out='';
 if(DAY.gold!=null&&DAY.silver!=null&&P.silver>0)out+='<span>Gold/silver ratio <b>'+f(P.gold/P.silver,1)+'</b></span>';
 if(best){var pct=chg/(tot-chg)*100;out='<span>Stack today <b class="'+(chg>=0?'up':'dn')+'">'+(chg>=0?'+':'−')+'$'+f(Math.abs(chg),2)+' ('+(pct>=0?'+':'−')+f(Math.abs(pct),2)+'%)</b></span><span>Biggest mover <b class="'+(best[1]>=0?'up':'dn')+'">'+best[0]+' '+(best[1]>=0?'+':'−')+f(Math.abs(best[1]),2)+'%</b></span>'+out}
 return out?'<div class="live">'+out+'</div>':'';
}
function num(id){var v=parseFloat($(id).value);return isFinite(v)&&v>=0?v:0}
function upd(){
 M.forEach(function(m){P[m.k]=num('p-'+m.k)});
 FX.forEach(function(x){R[x.k]=num('r-'+x.k)||x.v});
 var tot=0,C=cur(),V={};
 M.forEach(function(m){
  var oz=num('q-'+m.k),g=oz*OZ,pg=P[m.k]/OZ,val=oz*P[m.k];tot+=val;V[m.k]=val;
  var r='';
  C.forEach(function(c){var d=c[3]==6?8:(m.k=='copper'?4:2);r+='<tr><td>'+c[0]+'</td><td>'+money(c[1],pg*c[2],d)+'</td><td>'+money(c[1],val*c[2],c[3])+'</td></tr>'});
  $('t-'+m.k).innerHTML=r;
 });
 $('tot-usd').textContent=money('$',tot,2);donut(V,tot);
 if(tot>0){var p=personality(V,tot);$('pers').style.display='';$('pers').innerHTML='<div class="lab">Your stack personality</div><div class="em">'+p[0]+'</div><h3>'+p[1]+'</h3><p>'+p[2]+'</p>'+livebar(V,tot)}else $('pers').innerHTML='<div class="lab">Your stack personality</div><div class="em">🪙</div><h3>Add some metal</h3><p>Enter a weight above and we will work out your stack personality, with live moves.</p>';
 var t='';
 C.forEach(function(c){t+='<tr><td>'+c[0]+'</td><td><b>'+money(c[1],tot*c[2],c[3])+'</b></td></tr>'});
 $('tot-rows').innerHTML=t;
}
build();
// Fill in live prices, leaving alone any field the visitor has already typed in.
document.querySelectorAll('#rates input').forEach(function(i){i.addEventListener('input',function(){i.dataset.dirty='1'})});
fetch('/api/dataviz/metal-calculator/live').then(function(r){return r.json()}).then(function(d){
 var n=0;
 function put(id,v){var el=$(id);if(v>0&&el&&!el.dataset.dirty){el.value=+v.toPrecision(6);n++}}
 M.forEach(function(m){put('p-'+m.k,(d.metals||{})[m.k])});
 FX.forEach(function(x){put('r-'+x.k,(d.fx||{})[x.k])});
 DAY=d.day||{};
 upd();
 var t=d.updated_at?new Date(d.updated_at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'';
 $('priceNote').textContent=n?'Live prices (latest futures close, so slightly delayed), updated '+t+'. You can edit any of them. 1 troy oz = 31.1035 g.':'Live prices unavailable, showing editable estimates. 1 troy oz = 31.1035 g.';
}).catch(function(){$('priceNote').textContent='Live prices unavailable, showing editable estimates. 1 troy oz = 31.1035 g.'});
// Tell the host page how tall to make the iframe.
function postHeight(){parent.postMessage({gcgIframeHeight:document.documentElement.scrollHeight,src:"metal-calculator"},location.origin);}
new ResizeObserver(postHeight).observe(document.body);
postHeight();
</script>
</body>
</html>
