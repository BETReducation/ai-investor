<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Visualisation — Growth Capital Academy</title>
<link rel="icon" type="image/png" href="/static/logos/Green Square.png">
<script>
  var _t = localStorage.getItem('gca-theme') || 'light';
  localStorage.setItem('gca-theme', _t);
  document.documentElement.setAttribute('data-theme', _t);
</script>
<link rel="stylesheet" href="/static/css/site-nav.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
.page-hero { padding: 100px 5% 48px; text-align: center; position: relative; overflow: hidden; background: var(--bg); }
.page-hero::before { content: ''; position: absolute; top: -10%; left: 50%; transform: translateX(-50%); width: 800px; height: 500px; background: radial-gradient(ellipse, rgba(0,212,170,0.10) 0%, transparent 65%); pointer-events: none; }
.hero-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
.section-badge { display: inline-flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green); margin-bottom: 18px; opacity: 0.85; }
.section-badge::before { content: ''; display: block; width: 18px; height: 1px; background: var(--green); }
.hero-title { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: clamp(32px, 5vw, 52px); letter-spacing: -0.03em; line-height: 1.08; color: var(--text); margin-bottom: 16px; }
.hero-sub { font-size: clamp(15px, 1.6vw, 18px); color: var(--muted); max-width: 560px; margin: 0 auto; line-height: 1.6; }
.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); text-decoration: none; margin-bottom: 20px; }
.back-link:hover { color: var(--text); }
.content-section { padding: 0 5% 60px; }
.content-inner { max-width: 820px; margin: 0 auto; }

/* POSTS */
.posts-list { display: flex; flex-direction: column; gap: 28px; }
.list-empty { font-size: 14px; color: var(--muted); text-align: center; padding: 60px 20px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
.post-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 28px;
  position: relative; display: flex; flex-direction: column; gap: 16px;
}
.post-title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: clamp(20px, 2.2vw, 26px); color: var(--text); letter-spacing: -0.02em; }
.post-section-label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--green); margin-bottom: 6px; }
.post-body { font-size: 14.5px; color: var(--muted); line-height: 1.7; }
.post-warning { font-size: 13px; color: #b7791f; background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3); border-radius: 10px; padding: 12px 14px; line-height: 1.6; }
.post-link a { color: var(--green); font-size: 13.5px; font-weight: 600; text-decoration: none; }
.post-link a:hover { text-decoration: underline; }
.post-date {
  align-self: flex-end; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted);
  opacity: 0.75; margin-top: -4px;
}

/* MARKET PULSE — live heat map. Defaults to dark (matches the approved
   gold-on-navy mockup) but respects the site's normal light/dark toggle —
   see the :root[data-theme="light"] overrides below for the light variant. */
body.pulse-page .section-badge, body.pulse-page .section-badge::before { color: #d4af6a; background: #d4af6a; }
/* Dave asked for a bigger map — the normal 820px reading-width column (sized
   for text posts) was capping it well below what the page has room for.
   Widened just for this page; post-card text underneath stays narrower (see
   body.pulse-page .post-card) so commentary doesn't stretch into hard-to-read
   long lines just because the container grew. */
body.pulse-page .content-inner { max-width: 1180px; }
body.pulse-page .post-card { max-width: 760px; margin-left: auto; margin-right: auto; }
.pulse-wrap { margin-bottom: 40px; }
.pulse-note {
  display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted);
  background: var(--card); border: 1px solid rgba(212,175,106,0.35); border-radius: 999px; padding: 8px 16px; margin-bottom: 22px;
}
.pulse-dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; animation: pulseDot 1.8s ease-in-out infinite; }
@keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.pulse-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
@media (max-width: 640px) { .pulse-stats { grid-template-columns: repeat(2, 1fr); } }
.pulse-stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 10px; text-align: center; }
.pulse-stat-value { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 26px; color: var(--text); }
.pulse-stat-value.up { color: #4ade80; }
.pulse-stat-value.down { color: #f87171; }
.pulse-stat-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.pulse-map-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 14px; position: relative; }
.pulse-map-svg { width: 100%; height: auto; display: block; touch-action: none; }
/* Mobile fix: maps are hard to read/tap at phone width, and pinch-to-zoom on a
   tiny inline card is awkward. An expand button blows the same map up to a
   fullscreen overlay (still portrait — no forced rotation) where pinch/drag
   zoom is enabled via attachPinchZoom(). touch-action:none above stops the
   browser's own page-scroll gesture from fighting our pointer-based pan. */
.pulse-map-expand-btn {
  position: absolute; top: 26px; right: 26px; z-index: 5; width: 34px; height: 34px; border-radius: 50%;
  background: rgba(15,18,32,0.7); border: 1px solid rgba(255,255,255,0.18); color: #f4f6ff; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1; padding: 0;
}
:root[data-theme="light"] .pulse-map-expand-btn { background: rgba(255,255,255,0.85); border-color: rgba(0,0,0,0.12); color: #1a1e2e; }
.pulse-map-card.expanded {
  position: fixed; inset: 0; z-index: 2000; margin: 0; border-radius: 0; border: none;
  display: flex; flex-direction: column; justify-content: center; background: var(--bg);
  padding: 44px 12px 12px;
}
.pulse-map-card.expanded .pulse-map-svg,
.pulse-map-card.expanded .pulse-detail-map-wrap { touch-action: none; }
.pulse-map-card.expanded .pulse-map-expand-btn { display: none; }
.pulse-map-close-btn {
  display: none; position: absolute; top: 10px; right: 10px; z-index: 6; width: 38px; height: 38px; border-radius: 50%;
  background: rgba(15,18,32,0.85); border: 1px solid rgba(255,255,255,0.18); color: #f4f6ff; cursor: pointer;
  font-size: 18px; line-height: 1; padding: 0;
}
:root[data-theme="light"] .pulse-map-close-btn { background: rgba(255,255,255,0.92); border-color: rgba(0,0,0,0.12); color: #1a1e2e; }
.pulse-map-card.expanded .pulse-map-close-btn { display: block; }
.pulse-map-zoom-hint {
  display: none; text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 8px;
}
.pulse-map-card.expanded .pulse-map-zoom-hint { display: block; }
body.pulse-map-lock { overflow: hidden; }
.pulse-continent { fill: rgba(148,163,196,0.4); stroke: rgba(148,163,196,0.55); stroke-width: 3; vector-effect: non-scaling-stroke; }
.pulse-map-credit { text-align: right; font-size: 10.5px; color: var(--muted); opacity: 0.6; margin-top: 6px; }
.pulse-map-credit a { color: inherit; }
.pulse-market-dot { cursor: pointer; stroke: rgba(255,255,255,0.7); stroke-width: 4; vector-effect: non-scaling-stroke; transition: r 0.15s ease; }
.pulse-market-dot:hover { stroke-width: 8; }
/* Light mode: the dark-navy palette above (pale slate land, white dot outlines)
   loses all contrast on a white card, so both get inverted here. */
:root[data-theme="light"] .pulse-continent { fill: rgba(90,100,140,0.28); stroke: rgba(90,100,140,0.5); }
:root[data-theme="light"] .pulse-market-dot { stroke: rgba(20,24,40,0.55); }
.pulse-legend { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.pulse-legend-bar { width: 160px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #f87171, #8892b0, #4ade80); }
.pulse-legend-size {
  display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11.5px; color: var(--muted);
  margin-top: 8px;
}
.pulse-legend-size-dots { display: flex; align-items: flex-end; gap: 5px; }
.pulse-legend-size-dots span { display: block; border-radius: 50%; background: rgba(148,163,196,0.55); }
.pulse-tooltip {
  /* var(--card) is a near-invisible tint (alpha ~0.03) meant for subtle card
     backgrounds sitting on the page's own background — fine there, but this
     tooltip floats on top of vivid, fast-changing map colors, so that alpha let
     whatever was underneath bleed straight through the text. Its own solid-ish
     background instead (still a little translucent, per the ask, just not
     see-through) — dark by default to match this page, with a light-theme swap. */
  position: absolute; pointer-events: none; background: rgba(15,18,32,0.94); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
  padding: 8px 12px; font-size: 12.5px; color: #f4f6ff; box-shadow: 0 8px 24px rgba(0,0,0,0.35); z-index: 20;
  opacity: 0; transition: opacity 0.12s ease; white-space: nowrap;
}
:root[data-theme="light"] .pulse-tooltip { background: rgba(255,255,255,0.94); border-color: rgba(0,0,0,0.1); color: #1a1e2e; }
.pulse-tooltip.show { opacity: 1; }
.pulse-tooltip .t-country { font-weight: 700; }
.pulse-tooltip .t-move { font-family: 'JetBrains Mono', monospace; }
.pulse-tooltip .t-move.up { color: #4ade80; }
.pulse-tooltip .t-move.down { color: #f87171; }
.pulse-tooltip-divider { border-top: 1px solid rgba(128,128,128,0.25); margin: 6px 0; }
.pulse-leaders { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px; }
@media (max-width: 640px) { .pulse-leaders { grid-template-columns: 1fr; } }
.pulse-leader-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
.pulse-leader-title { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.pulse-leader-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 13.5px; color: var(--text); border-top: 1px solid var(--border); }
.pulse-leader-row:first-of-type { border-top: none; }
.pulse-leader-move { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
.pulse-leader-move.up { color: #4ade80; }
.pulse-leader-move.down { color: #f87171; }
.pulse-divider { border: none; border-top: 1px solid var(--border); margin: 0 0 40px; }

/* Simple / Detailed tabs */
.pulse-tabs { display: inline-flex; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin-bottom: 16px; }
.pulse-tab-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--muted); background: transparent; border: none; border-radius: 999px; padding: 8px 18px; cursor: pointer; transition: all 0.15s ease;
}
.pulse-tab-btn.active { background: #d4af6a; color: #1a1206; }
.pulse-tab-panel { display: none; }
.pulse-tab-panel.active { display: block; }

/* Detailed tab — real per-country choropleth (see world-map-countries.svg) plus
   a sentiment gauge and a major-indices ticker strip. */
.pulse-detail-map-wrap svg { width: 100%; height: auto; display: block; touch-action: none; }
.pulse-detail-map-wrap .landxx { cursor: pointer; transition: opacity 0.1s ease; }
.pulse-detail-map-wrap .landxx:hover { opacity: 0.75; }
/* The source file's own default styling hardcodes a white ocean/#e0e0e0 land —
   fine on a white card, but the ocean reads as a jarring white slab on the dark
   card. Override both to sit in the card's own background/border tones instead. */
.pulse-detail-map-wrap .oceanxx { fill: var(--bg) !important; stroke: none !important; }
.pulse-detail-map-wrap .landxx { fill: rgba(148,163,196,0.25) !important; stroke: var(--card) !important; }
:root[data-theme="light"] .pulse-detail-map-wrap .landxx { fill: rgba(90,100,140,0.22) !important; }
.pulse-gauge-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 16px; }
.pulse-gauge-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); text-align: center; }
.pulse-gauge-value { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px; }
.pulse-detail-legend { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.pulse-detail-legend-swatch { display: inline-flex; align-items: center; gap: 6px; }
.pulse-detail-legend-swatch span.sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.pulse-ticker { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; margin-top: 14px; }
.pulse-ticker-chip {
  flex: 0 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; min-width: 128px;
}
.pulse-ticker-country { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.pulse-ticker-index { font-size: 13px; font-weight: 700; color: var(--text); margin: 2px 0; }
.pulse-ticker-divider { border-top: 1px solid var(--border); margin: 6px 0; }
.pulse-ticker-move { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 600; }
.pulse-ticker-move.up { color: #4ade80; }
.pulse-ticker-move.down { color: #f87171; }

/* List tab — a continent-grouped, scrollable, tap-friendly alternative to the
   maps. On phones, finding/tapping a specific country dot on a squeezed-down
   world map is unreliable regardless of zoom, so this is offered as a first-class
   view (not just a fallback) and is the default tab under 640px. */
.pulse-list-group { margin-bottom: 10px; }
.pulse-list-group:last-child { margin-bottom: 0; }
.pulse-list-group-title {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; user-select: none;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
  text-transform: uppercase; color: #d4af6a; margin-bottom: 8px; padding: 14px 16px;
  background: var(--card); border: 1px solid rgba(212,175,106,0.3); border-radius: 12px;
}
/* #d4af6a (tuned for the dark card) drops to ~2:1 contrast against a white
   card — a deeper amber-brown reads properly here without changing the palette
   on dark, where the paler gold is what was actually asked for. */
:root[data-theme="light"] .pulse-list-group-title { color: #96650f; border-color: rgba(150,101,15,0.28); }
.pulse-list-group-chevron {
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 28px; height: 28px; border-radius: 50%; background: rgba(212,175,106,0.16); color: inherit;
  transition: transform 0.15s ease; font-size: 15px;
}
.pulse-list-group.collapsed .pulse-list-group-chevron { transform: rotate(-90deg); }
.pulse-list-group-rows { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.18s ease; }
.pulse-list-group-rows > div { overflow: hidden; }
.pulse-list-group.collapsed .pulse-list-group-rows { grid-template-rows: 0fr; }
.pulse-list-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); margin-bottom: 8px;
}
.pulse-list-country { font-size: 14px; font-weight: 600; color: var(--text); }
.pulse-list-index { font-size: 12px; color: var(--muted); margin-top: 1px; }
.pulse-list-right { text-align: right; flex-shrink: 0; }
.pulse-list-price { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
.pulse-list-move { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; }
.pulse-list-move.up { color: #4ade80; }
.pulse-list-move.down { color: #f87171; }

/* GOLD:SILVER RATIO — live animated balance-scale widget. Same dark-navy/gold
   accent language as the Market Pulse widget above, but its own flat SVG scale
   instead of a map. The beam+chains+pans rotate as one rigid unit (not a
   physically-accurate pendulum where the pans stay level) — simpler to build,
   still reads clearly, and matches the flat-icon style of the rest of the site
   better than a photoreal render would. Tilt is driven by gsrTilt() below:
   level = today's ratio sitting exactly at the real computed historical
   average, not an arbitrary "always tilted" illustration. */
body.gsr-page .section-badge, body.gsr-page .section-badge::before { color: #d4af6a; background: #d4af6a; }
.gsr-wrap { margin-bottom: 40px; }
.gsr-note {
  display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted);
  background: var(--card); border: 1px solid rgba(212,175,106,0.35); border-radius: 999px; padding: 8px 16px; margin-bottom: 22px;
}
.gsr-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 40px 24px 34px; text-align: center; }
.gsr-scale-area { position: relative; max-width: 400px; margin: 0 auto 6px; cursor: pointer; }
.gsr-scale-area:hover .gsr-svg { filter: brightness(1.05); }
.gsr-scale-area.gsr-refreshing { cursor: wait; }
.gsr-scale-area.gsr-refreshing .gsr-svg { opacity: 0.55; transition: opacity 0.15s ease; }
.gsr-tap-hint { font-size: 11px; color: var(--muted); opacity: 0.65; margin-top: 10px; }
.gsr-scale-area::before {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 320px; height: 240px;
  background: radial-gradient(ellipse, rgba(212,175,106,0.14) 0%, transparent 70%); pointer-events: none;
}
.gsr-svg { position: relative; width: 100%; height: auto; display: block; }
/* transform-origin matches the pivot's SVG coordinates (200,90) exactly — the
   whole arm (beam, chains, pans, bar stacks) is one <g> so it swings as a rigid
   unit around that single point. Geometry below (viewBox 0 0 400 320) leaves a
   real gap between the pans (bottom edge y=188) and the amount labels (start
   ~y=210, positioned via .gsr-label's top%) — a previous version had them only
   ~1px apart, which read as overlapping. */
.gsr-arm { transform-origin: 200px 90px; transform: rotate(0deg); transition: transform 1.4s cubic-bezier(0.34, 1.3, 0.4, 1); }
.gsr-stand-fill { fill: rgba(148,163,196,0.35); }
:root[data-theme="light"] .gsr-stand-fill { fill: rgba(90,100,140,0.28); }
.gsr-beam-line { stroke: #d4af6a; stroke-width: 4; stroke-linecap: round; }
.gsr-beam-cap { fill: #d4af6a; }
.gsr-chain { stroke: rgba(148,163,196,0.6); stroke-width: 2; }
:root[data-theme="light"] .gsr-chain { stroke: rgba(90,100,140,0.55); }
.gsr-pan { fill: rgba(148,163,196,0.18); stroke: rgba(148,163,196,0.6); stroke-width: 2; }
:root[data-theme="light"] .gsr-pan { fill: rgba(90,100,140,0.12); stroke: rgba(90,100,140,0.5); }
.gsr-bar-gold { fill: #d4af6a; }
.gsr-bar-gold-top { fill: #f0d999; }
.gsr-bar-silver { fill: #aab4c8; }
.gsr-bar-silver-top { fill: #dbe2ee; }
/* Soft glow behind the metal stacks: a blurred duplicate of each bar shape,
   painted first (so it sits behind the crisp bars on top of it) at reduced
   opacity — the standard cheap SVG "glow" technique, since CSS filter:
   drop-shadow on a rotating parent <g> would blur/offset with the rotation
   in a way a plain feGaussianBlur copy doesn't. */
.gsr-glow-gold { fill: #f6d68c; opacity: 0.6; }
.gsr-glow-silver { fill: #e9f0fb; opacity: 0.5; }
.gsr-label { position: absolute; top: 65.5%; width: 120px; text-align: center; pointer-events: none; }
.gsr-label-left { left: 19.5%; transform: translateX(-50%); }
.gsr-label-right { left: 80.5%; transform: translateX(-50%); }
.gsr-label-amount { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 17px; color: var(--text); }
.gsr-label-metal { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: var(--muted); margin-top: 1px; }
.gsr-headline { margin-top: 20px; }
.gsr-headline-label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.gsr-headline-value { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: clamp(32px, 5vw, 44px); color: var(--text); letter-spacing: -0.02em; }
.gsr-sub { font-size: 13px; color: var(--muted); margin-top: 8px; }
.gsr-sub strong { color: var(--text); font-weight: 700; }

footer { border-top: 1px solid var(--border); padding: 48px 5%; margin-top: 40px; }
.footer-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
.footer-links { display: flex; gap: 28px; flex-wrap: wrap; }
.footer-links a { font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.2s; }
.footer-links a:hover { color: var(--text); }
.footer-copy { font-size: 12px; color: rgba(136,146,176,0.5); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

<script>
function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

const slug = window.location.pathname.split('/').filter(Boolean).pop();

function setHeroSub(text) {
  const el = document.getElementById('pageHeroSub');
  if (text) {
    el.textContent = text;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

async function loadPage() {
  try {
    const res = await fetch(`/api/dataviz/${encodeURIComponent(slug)}/content`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    document.getElementById('pageTitle').textContent = data.label || 'Data Visualisation';
    document.title = `${data.label || 'Data Visualisation'} — Growth Capital Academy`;
    const headerImg = document.getElementById('pageHeaderImage');
    if (data.header_image_url) {
      headerImg.src = data.header_image_url;
      headerImg.alt = data.label || '';
      headerImg.style.display = 'block';
    }
    if (slug === 'global-heat-map') {
      // Gold accent (body.pulse-page rules above) applies in both themes; the
      // toggle itself is left alone so visitors can pick light or dark like any
      // other page — see the :root[data-theme="light"] overrides for the map/dot
      // styling that has to flip for legibility on a white card.
      setHeroSub(data.description || "Every major index worldwide, colored by today's move — refreshes automatically.");
      document.body.classList.add('pulse-page');
      initMarketPulse();
    } else if (slug === 'gold-silver-ratio') {
      setHeroSub(data.description || "How many ounces of silver it takes to match the value of one ounce of gold, right now — refreshes every 12 hours.");
      document.body.classList.add('gsr-page');
      initGoldSilverRatio();
    } else {
      setHeroSub(data.description);
    }
  } catch {
    document.getElementById('pageTitle').textContent = 'Not Found';
    setHeroSub("This page couldn't be found.");
  }
}

// ── Market Pulse — live global heat map ────────────────────────────────────
const PULSE_REFRESH_MS = 5 * 60 * 1000; // matches the server's own 5-min cache TTL
let pulseTimer = null;

function pulseColor(pct) {
  // Clamp to a +/-2% range so a couple of outliers don't wash out the rest of the map.
  const t = Math.max(-1, Math.min(1, pct / 2));
  const down = [248, 113, 113], mid = [148, 158, 196], up = [74, 222, 128];
  const [a, b] = t < 0 ? [mid, down] : [mid, up];
  // A straight linear blend left small, everyday moves (the Europe cluster is
  // usually +/-0.3%) sitting almost entirely in the flat gray "mid" tone —
  // technically correct but reads as dull. Easing the blend with a sub-1
  // power gets color into those small moves faster while leaving the actual
  // +/-2% extremes (where f=1 either way) exactly as saturated as before.
  const f = Math.pow(Math.abs(t), 0.6);
  const rgb = a.map((c, i) => Math.round(c + (b[i] - c) * f));
  return `rgb(${rgb.join(',')})`;
}

// Map viewBox is 5760x2880 (see lonToX/latToY) — 5.76x the old 1000x500 box —
// so radii need the same scale-up to read at the same visual size on screen.
const PULSE_MAP_SCALE = 5.76;
function pulseRadius(pct) {
  // Raised the floor from 4 to 7 — near-zero movers (pale, low-contrast color)
  // were getting lost on the map at the old minimum size.
  return Math.min(14, 7 + Math.abs(pct) * 2.6) * PULSE_MAP_SCALE;
}

// Phones default to the List tab — tapping a specific country dot on a
// squeezed-down world map is unreliable at that width no matter how much zoom
// is added, so a scrollable tap-friendly list is the more usable starting
// point there. Desktop/tablet still default to the map as before.
let pulseActiveTab = (window.matchMedia && window.matchMedia('(max-width: 640px)').matches) ? 'list' : 'simple';
let _pulseLatestData = null; // last successful fetch, so switching tabs (or a lazy detail-tab init) doesn't need to wait on a new request

function initMarketPulse() {
  const wrap = document.getElementById('pulseContainer');
  wrap.innerHTML = `
    <div class="pulse-wrap">
      <div class="pulse-note"><span class="pulse-dot-live"></span><span id="pulseUpdated">Loading live prices…</span></div>
      <div class="pulse-stats" id="pulseStats"></div>
      <div class="pulse-tabs">
        <button class="pulse-tab-btn" id="pulseTabBtnSimple" onclick="switchPulseTab('simple')">Simple</button>
        <button class="pulse-tab-btn" id="pulseTabBtnDetailed" onclick="switchPulseTab('detailed')">Detailed</button>
        <button class="pulse-tab-btn" id="pulseTabBtnList" onclick="switchPulseTab('list')">List</button>
      </div>

      <div class="pulse-tab-panel" id="pulseTabSimple">
        <div class="pulse-map-card" id="pulseSimpleMapCard">
          <button class="pulse-map-expand-btn" type="button" aria-label="Expand map" onclick="toggleMapExpand('pulseSimpleMapCard')">⤢</button>
          <button class="pulse-map-close-btn" type="button" aria-label="Close expanded map" onclick="toggleMapExpand('pulseSimpleMapCard')">✕</button>
          <svg class="pulse-map-svg" id="pulseMapSvg" viewBox="0 180 5760 2200" xmlns="http://www.w3.org/2000/svg"></svg>
          <div class="pulse-tooltip" id="pulseTooltip"></div>
          <div class="pulse-map-zoom-hint">Pinch or drag to zoom · tap ✕ to close</div>
        </div>
        <div class="pulse-legend"><span>Down</span><div class="pulse-legend-bar"></div><span>Up</span></div>
        <div class="pulse-legend-size">
          <div class="pulse-legend-size-dots"><span style="width:6px;height:6px;"></span><span style="width:11px;height:11px;"></span><span style="width:16px;height:16px;"></span></div>
          <span>Circle size = size of today's move</span>
        </div>
        <div class="pulse-map-credit">Map: <a href="https://commons.wikimedia.org/wiki/File:Equirectangular_projection_world_map_without_borders.svg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY-SA 4.0</div>
      </div>

      <div class="pulse-tab-panel" id="pulseTabDetailed">
        <div class="pulse-gauge-row" id="pulseGaugeRow"></div>
        <div class="pulse-map-card" id="pulseDetailMapCard">
          <button class="pulse-map-expand-btn" type="button" aria-label="Expand map" onclick="toggleMapExpand('pulseDetailMapCard')">⤢</button>
          <button class="pulse-map-close-btn" type="button" aria-label="Close expanded map" onclick="toggleMapExpand('pulseDetailMapCard')">✕</button>
          <div class="pulse-detail-map-wrap" id="pulseDetailMapWrap">Loading map…</div>
          <div class="pulse-tooltip" id="pulseDetailTooltip"></div>
          <div class="pulse-map-zoom-hint">Pinch or drag to zoom · tap ✕ to close</div>
        </div>
        <div class="pulse-detail-legend" id="pulseDetailLegend"></div>
        <div class="pulse-ticker" id="pulseTicker"></div>
        <div class="pulse-map-credit">Map: <a href="https://commons.wikimedia.org/wiki/File:BlankMap-World-Compact.svg" target="_blank" rel="noopener">Wikimedia Commons</a> (public domain)</div>
      </div>

      <div class="pulse-tab-panel" id="pulseTabList">
        <div id="pulseListBody"><div class="list-empty">Loading…</div></div>
      </div>
    </div>
    <div class="pulse-leaders" id="pulseLeaders"></div>
    <hr class="pulse-divider">
  `;
  switchPulseTab(pulseActiveTab);
  drawPulseContinents();
  fetchPulse();
  if (pulseTimer) clearInterval(pulseTimer);
  pulseTimer = setInterval(fetchPulse, PULSE_REFRESH_MS);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const expanded = document.querySelector('.pulse-map-card.expanded');
      if (expanded) toggleMapExpand(expanded.id);
    }
  });
  // Single delegated listener (not re-added per render) that closes a pinned
  // tooltip when the user taps anywhere outside a dot/country — the dot/land
  // click handlers themselves stopPropagation so this only fires for "elsewhere".
  document.addEventListener('click', () => {
    document.querySelectorAll('.pulse-tooltip.show').forEach(t => t.classList.remove('show'));
  });
}

async function switchPulseTab(tab) {
  pulseActiveTab = tab;
  document.getElementById('pulseTabBtnSimple').classList.toggle('active', tab === 'simple');
  document.getElementById('pulseTabBtnDetailed').classList.toggle('active', tab === 'detailed');
  document.getElementById('pulseTabBtnList').classList.toggle('active', tab === 'list');
  document.getElementById('pulseTabSimple').classList.toggle('active', tab === 'simple');
  document.getElementById('pulseTabDetailed').classList.toggle('active', tab === 'detailed');
  document.getElementById('pulseTabList').classList.toggle('active', tab === 'list');
  // The detailed map (a ~1MB SVG with every country as its own shape) is only
  // fetched the first time someone actually opens the tab, not on page load.
  if (tab === 'detailed' && _pulseLatestData) {
    await renderPulseDetail(_pulseLatestData);
  }
  if (tab === 'list' && _pulseLatestData) {
    renderPulseList(_pulseLatestData);
  }
}

// ── Fullscreen expand + pinch/drag zoom ─────────────────────────────────────
// Forcing landscape orientation on tap was considered and dropped — it's
// unsupported in iOS Safari and jarring even where it works. This is the
// standard "tap to expand" pattern instead: the map card goes fixed/fullscreen
// (still portrait) with pinch-to-zoom and drag-to-pan wired directly to it.
const _pulseZoomState = {}; // cardId -> { scale, x, y, pointers: Map }

function toggleMapExpand(cardId) {
  const card = document.getElementById(cardId);
  if (!card) return;
  const expanding = !card.classList.contains('expanded');
  card.classList.toggle('expanded', expanding);
  document.body.classList.toggle('pulse-map-lock', expanding);
  const target = card.querySelector('.pulse-map-svg') || card.querySelector('.pulse-detail-map-wrap svg');
  if (!target) return;
  if (expanding) {
    if (!_pulseZoomState[cardId]) attachPinchZoom(cardId, target);
    resetPulseZoom(cardId, target);
  } else {
    resetPulseZoom(cardId, target);
  }
}

function resetPulseZoom(cardId, target) {
  _pulseZoomState[cardId] = Object.assign(_pulseZoomState[cardId] || { pointers: new Map() }, { scale: 1, x: 0, y: 0 });
  target.style.transform = '';
}

function attachPinchZoom(cardId, target) {
  const state = _pulseZoomState[cardId] = { scale: 1, x: 0, y: 0, pointers: new Map(), pinchStartDist: 0, pinchStartScale: 1 };
  const apply = () => { target.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`; };
  const dist = pts => { const [a, b] = pts; return Math.hypot(a.x - b.x, a.y - b.y); };

  target.addEventListener('pointerdown', e => {
    if (!target.closest('.pulse-map-card.expanded')) return;
    target.setPointerCapture(e.pointerId);
    state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (state.pointers.size === 2) {
      state.pinchStartDist = dist([...state.pointers.values()]);
      state.pinchStartScale = state.scale;
    }
  });
  target.addEventListener('pointermove', e => {
    if (!state.pointers.has(e.pointerId)) return;
    const prev = state.pointers.get(e.pointerId);
    state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (state.pointers.size === 2) {
      const pts = [...state.pointers.values()];
      const d = dist(pts);
      if (state.pinchStartDist > 0) {
        state.scale = Math.min(6, Math.max(1, state.pinchStartScale * (d / state.pinchStartDist)));
        apply();
      }
    } else if (state.pointers.size === 1 && state.scale > 1) {
      state.x += e.clientX - prev.x;
      state.y += e.clientY - prev.y;
      apply();
    }
  });
  const release = e => {
    state.pointers.delete(e.pointerId);
    if (state.pointers.size < 2) state.pinchStartDist = 0;
  };
  target.addEventListener('pointerup', release);
  target.addEventListener('pointercancel', release);
  target.addEventListener('dblclick', () => { state.scale = 1; state.x = 0; state.y = 0; apply(); });
  // Desktop convenience — wheel to zoom while expanded, same as pinch.
  target.addEventListener('wheel', e => {
    if (!target.closest('.pulse-map-card.expanded')) return;
    e.preventDefault();
    state.scale = Math.min(6, Math.max(1, state.scale - e.deltaY * 0.0015));
    apply();
  }, { passive: false });
}

// Real land outline (Wikimedia Commons, CC BY-SA 4.0 — credited under the map)
// rather than stylized blobs. Its viewBox (0 0 5760 2880) is exactly an 8x scale
// of a 720x360 equirectangular projection, so lon/lat map onto it directly with
// no separate rescale, and dots drawn in the same coordinate space line up with
// real coastlines. Fetched once and cached — every redraw (each 5-min refresh)
// reuses the same path string instead of re-fetching it.
let _pulseLandPath = null;
function lonToX(lon) { return (lon + 180) / 360 * 5760; }
function latToY(lat) { return (90 - lat) / 180 * 2880; }

async function getPulseLandPath() {
  if (_pulseLandPath !== null) return _pulseLandPath;
  try {
    const res = await fetch('/static/img/world-map-outline.svg');
    const text = await res.text();
    const match = text.match(/<path[^>]*\sd="([^"]+)"/);
    _pulseLandPath = match ? match[1] : '';
  } catch {
    _pulseLandPath = '';
  }
  return _pulseLandPath;
}

async function drawPulseContinents() {
  const svg = document.getElementById('pulseMapSvg');
  const d = await getPulseLandPath();
  svg.innerHTML = d ? `<path class="pulse-continent" d="${d}"></path>` : '';
}

async function fetchPulse() {
  try {
    const res = await fetch('/api/dataviz/global-heat-map/live');
    if (!res.ok) throw new Error();
    const data = await res.json();
    renderPulse(data);
  } catch {
    const el = document.getElementById('pulseUpdated');
    if (el) el.textContent = 'Live prices are temporarily unavailable — showing the last known snapshot.';
  }
}

async function renderPulse(data) {
  const { markets = [], summary = {}, updated_at } = data;
  _pulseLatestData = data;

  const updatedEl = document.getElementById('pulseUpdated');
  if (updatedEl && updated_at) {
    const d = new Date(updated_at);
    updatedEl.textContent = `Live · updated ${d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`;
  }

  document.getElementById('pulseStats').innerHTML = `
    <div class="pulse-stat"><div class="pulse-stat-value">${summary.tracked ?? 0}</div><div class="pulse-stat-label">Markets tracked</div></div>
    <div class="pulse-stat"><div class="pulse-stat-value up">${summary.up ?? 0}</div><div class="pulse-stat-label">Up today</div></div>
    <div class="pulse-stat"><div class="pulse-stat-value down">${summary.down ?? 0}</div><div class="pulse-stat-label">Down today</div></div>
    <div class="pulse-stat"><div class="pulse-stat-value ${(summary.avg_move||0) >= 0 ? 'up' : 'down'}">${(summary.avg_move||0) >= 0 ? '+' : ''}${(summary.avg_move ?? 0).toFixed(2)}%</div><div class="pulse-stat-label">Avg move</div></div>
  `;

  const svg = document.getElementById('pulseMapSvg');
  const tooltip = document.getElementById('pulseTooltip');
  await drawPulseContinents();
  const dotsHtml = markets.map(m => {
    const x = lonToX(m.lon), y = latToY(m.lat);
    return `<circle class="pulse-market-dot" cx="${x}" cy="${y}" r="${pulseRadius(m.pct_change)}" fill="${pulseColor(m.pct_change)}" data-country="${esc(m.country)}" data-index="${esc(m.index)}" data-pct="${m.pct_change}" data-price="${m.price}"></circle>`;
  }).join('');
  svg.insertAdjacentHTML('beforeend', dotsHtml);

  const showDotTooltip = (dot, clientX, clientY) => {
    const pct = parseFloat(dot.dataset.pct);
    const sign = pct >= 0 ? '+' : '';
    tooltip.innerHTML = `<div class="t-country">${esc(dot.dataset.country)}</div><div>${esc(dot.dataset.index)} · ${dot.dataset.price}</div><div class="t-move ${pct >= 0 ? 'up' : 'down'}">${sign}${pct.toFixed(2)}%</div>`;
    const cardRect = svg.closest('.pulse-map-card').getBoundingClientRect();
    tooltip.style.left = `${clientX - cardRect.left + 14}px`;
    tooltip.style.top = `${clientY - cardRect.top + 14}px`;
    tooltip.classList.add('show');
  };
  svg.querySelectorAll('.pulse-market-dot').forEach(dot => {
    dot.addEventListener('mousemove', e => showDotTooltip(dot, e.clientX, e.clientY));
    dot.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
    // Touch devices don't fire mousemove on tap, so the map had no working
    // interaction on mobile at all before this — tap toggles the tooltip
    // pinned on that dot; a document-level listener below closes it on tap
    // elsewhere. click also covers the fallback mouse case.
    dot.addEventListener('click', e => {
      e.stopPropagation();
      const wasShown = tooltip.classList.contains('show') && tooltip.dataset.pinnedFor === dot.dataset.country + dot.dataset.index;
      if (wasShown) { tooltip.classList.remove('show'); return; }
      showDotTooltip(dot, e.clientX, e.clientY);
      tooltip.dataset.pinnedFor = dot.dataset.country + dot.dataset.index;
    });
  });

  const sorted = [...markets].sort((a, b) => b.pct_change - a.pct_change);
  const gainers = sorted.slice(0, 3);
  const losers = sorted.slice(-3).reverse();
  const leaderRow = m => `<div class="pulse-leader-row"><span>${esc(m.country)} <span style="color:var(--muted);">· ${esc(m.index)}</span></span><span class="pulse-leader-move ${m.pct_change >= 0 ? 'up' : 'down'}">${m.pct_change >= 0 ? '+' : ''}${m.pct_change.toFixed(2)}%</span></div>`;
  document.getElementById('pulseLeaders').innerHTML = `
    <div class="pulse-leader-card"><div class="pulse-leader-title">Top gainers</div>${gainers.map(leaderRow).join('') || '<div class="pulse-leader-row">—</div>'}</div>
    <div class="pulse-leader-card"><div class="pulse-leader-title">Top losers</div>${losers.map(leaderRow).join('') || '<div class="pulse-leader-row">—</div>'}</div>
  `;

  // Keep the detailed tab's coloring current too if it's the one on screen —
  // otherwise it just picks up _pulseLatestData next time someone opens it.
  if (pulseActiveTab === 'detailed') await renderPulseDetail(data);
  if (pulseActiveTab === 'list') renderPulseList(data);
}

// ── List tab — continent-grouped, tap-friendly rows (see .pulse-list-* CSS) ─
// Rough lon/lat bounding boxes rather than a hand-maintained country→continent
// table — this tracks whatever markets the API returns (currently ~40 and
// growing) without needing updates here every time a new market is added.
// Order matters: Oceania is checked before the wider Asia box since Indonesia/
// the Pacific rim would otherwise fall inside both.
function continentFromLonLat(lon, lat) {
  if (lon >= 110 && lon <= 180 && lat <= -10) return 'Oceania';
  if (lon >= -170 && lon <= -30 && lat >= 7) return 'North America';
  if (lon >= -90 && lon <= -30 && lat < 7) return 'South America';
  if (lon >= -25 && lon <= 40 && lat >= 35) return 'Europe';
  // Carved out ahead of the Africa box below — Saudi Arabia (~45,24) and
  // Israel (~35,31) both fell inside Africa's lon<=55 range and were landing
  // in the wrong group. This box covers the Middle East explicitly first.
  if (lon >= 34 && lon <= 60 && lat >= 12 && lat <= 42) return 'Asia & Middle East';
  if (lon >= -20 && lon <= 55 && lat < 35 && lat >= -35) return 'Africa';
  return 'Asia & Middle East';
}
const PULSE_CONTINENT_ORDER = ['North America', 'Europe', 'Asia & Middle East', 'South America', 'Africa', 'Oceania'];

// Collapsed state lives outside renderPulseList so it survives the 5-min
// auto-refresh re-render (which rebuilds the whole list from scratch) — keyed
// by continent name rather than DOM node since that's what stays stable.
// Seeded with every continent so the list first renders fully collapsed —
// just region headers to scan, tap one to expand it.
const _pulseListCollapsed = new Set(PULSE_CONTINENT_ORDER);
function togglePulseListGroup(continent) {
  if (_pulseListCollapsed.has(continent)) _pulseListCollapsed.delete(continent);
  else _pulseListCollapsed.add(continent);
  document.getElementById(`pulseListGroup-${continent.replace(/[^a-z0-9]/gi, '')}`)
    ?.classList.toggle('collapsed', _pulseListCollapsed.has(continent));
}

function renderPulseList(data) {
  const { markets = [] } = data;
  const body = document.getElementById('pulseListBody');
  if (!body) return;
  if (!markets.length) { body.innerHTML = '<div class="list-empty">No market data right now.</div>'; return; }

  const groups = {};
  markets.forEach(m => {
    const continent = continentFromLonLat(m.lon, m.lat);
    (groups[continent] ||= []).push(m);
  });
  Object.values(groups).forEach(rows => rows.sort((a, b) => a.country.localeCompare(b.country)));

  const row = m => {
    const pct = m.pct_change, sign = pct >= 0 ? '+' : '';
    return `
      <div class="pulse-list-row">
        <div><div class="pulse-list-country">${esc(m.country)}</div><div class="pulse-list-index">${esc(m.index)}</div></div>
        <div class="pulse-list-right"><div class="pulse-list-move ${pct >= 0 ? 'up' : 'down'}">${sign}${pct.toFixed(2)}%</div><div class="pulse-list-price">${esc(String(m.price))}</div></div>
      </div>`;
  };
  body.innerHTML = PULSE_CONTINENT_ORDER.filter(c => groups[c]?.length).map(continent => {
    const domId = continent.replace(/[^a-z0-9]/gi, '');
    const collapsed = _pulseListCollapsed.has(continent);
    return `
    <div class="pulse-list-group${collapsed ? ' collapsed' : ''}" id="pulseListGroup-${domId}">
      <div class="pulse-list-group-title" onclick="togglePulseListGroup('${continent.replace(/'/g, "\\'")}')">
        <span>${esc(continent)} · ${groups[continent].length}</span>
        <span class="pulse-list-group-chevron">▾</span>
      </div>
      <div class="pulse-list-group-rows"><div>${groups[continent].map(row).join('')}</div></div>
    </div>
  `;
  }).join('');
}

// ── Detailed tab — choropleth map, sentiment gauge, major-indices ticker ───
const PULSE_COUNTRY_BUCKETS = [
  { max: -2,    color: '#b91c1c', label: '-2% and below' },
  { max: -0.5,  color: '#f87171', label: '-2% to -0.5%' },
  { max: 0.5,   color: '#eab308', label: '-0.5% to +0.5%' },
  { max: 2,     color: '#4ade80', label: '+0.5% to +2%' },
  { max: Infinity, color: '#15803d', label: '+2% and above' },
];
function pulseBucketColor(pct) {
  return PULSE_COUNTRY_BUCKETS.find(b => pct <= b.max).color;
}

let _pulseCountrySvgMarkup = null;
async function getPulseCountrySvgMarkup() {
  if (_pulseCountrySvgMarkup !== null) return _pulseCountrySvgMarkup;
  try {
    const res = await fetch('/static/img/world-map-countries.svg');
    _pulseCountrySvgMarkup = await res.text();
  } catch {
    _pulseCountrySvgMarkup = '';
  }
  return _pulseCountrySvgMarkup;
}

async function renderPulseDetail(data) {
  const { markets = [], summary = {} } = data;
  const wrap = document.getElementById('pulseDetailMapWrap');
  const tooltip = document.getElementById('pulseDetailTooltip');
  if (!wrap) return; // tab markup not built yet

  // Inject the map once — after that, every refresh just swaps the <style>
  // fill rules rather than re-parsing a ~1MB SVG on every 5-min tick.
  if (!wrap.dataset.loaded) {
    const markup = await getPulseCountrySvgMarkup();
    wrap.innerHTML = markup || '<div class="list-empty">Map unavailable right now.</div>';
    if (markup) {
      wrap.dataset.loaded = '1';
      // The source map ships a <title> per country (e.g. "United States of
      // America") that the browser renders as its own native tooltip — it was
      // stacking on top of (and fighting for space with) our custom one. Strip
      // them so only the styled tooltip shows; the country name is already in it.
      wrap.querySelectorAll('title').forEach(t => t.remove());
    }
  }
  const svg = wrap.querySelector('svg');
  if (!svg) return;

  // byIso2: last-one-wins single market per country, used only to decide the
  // choropleth's one fill color (see MARKET_PULSE_INDICES ordering in app.py —
  // the more widely-recognized index is listed last so it wins here).
  // byIso2All: every market for that country, used by the hover tooltip so a
  // country with 2 tracked indices (US, UK, China, India, Japan, South Korea)
  // shows both instead of just whichever one happened to win the fill color.
  const byIso2 = {};
  const byIso2All = {};
  markets.forEach(m => {
    if (!m.iso2) return;
    byIso2[m.iso2] = m;
    (byIso2All[m.iso2] ||= []).push(m);
  });

  // Colored via inline style (highest-precedence, deterministic) rather than an
  // injected <style> class rule — the map's own default styling and our light/dark
  // "no data" overrides are both !important stylesheet rules at equal specificity,
  // which left country coloring at the mercy of stylesheet cascade order and
  // apparently didn't resolve the same way in every browser. Inline + !important
  // always wins regardless of stylesheet order, so this can't lose that fight.
  Object.entries(byIso2).forEach(([iso2, m]) => {
    const color = pulseBucketColor(m.pct_change);
    Array.from(svg.getElementsByClassName(iso2)).forEach(el => {
      if (el.classList.contains('landxx')) el.style.setProperty('fill', color, 'important');
    });
  });

  // Hover (or tap, for touch devices — see onclick below) any tracked country
  // for its name/index/move — delegated on the SVG root since the map has
  // thousands of shapes and only ~30 are ours to color.
  const showLandTooltip = (rows, clientX, clientY) => {
    const rowsHtml = rows.map(m => {
      const pct = m.pct_change, sign = pct >= 0 ? '+' : '';
      return `<div>${esc(m.index)} · ${m.price}</div><div class="t-move ${pct >= 0 ? 'up' : 'down'}">${sign}${pct.toFixed(2)}%</div>`;
    }).join('<div class="pulse-tooltip-divider"></div>');
    tooltip.innerHTML = `<div class="t-country">${esc(rows[0].country)}</div>${rowsHtml}`;
    const cardRect = wrap.closest('.pulse-map-card').getBoundingClientRect();
    tooltip.style.left = `${clientX - cardRect.left + 14}px`;
    tooltip.style.top = `${clientY - cardRect.top + 14}px`;
    tooltip.classList.add('show');
  };
  svg.onmousemove = e => {
    const el = e.target.closest('.landxx');
    const iso2 = el && [...el.classList].find(c => byIso2All[c]);
    const rows = iso2 && byIso2All[iso2];
    if (!rows) { tooltip.classList.remove('show'); return; }
    showLandTooltip(rows, e.clientX, e.clientY);
  };
  svg.onmouseleave = () => tooltip.classList.remove('show');
  // Tap support — mousemove never fires from a touch tap, so the choropleth
  // had no working interaction on mobile before this.
  svg.onclick = e => {
    e.stopPropagation();
    const el = e.target.closest('.landxx');
    const iso2 = el && [...el.classList].find(c => byIso2All[c]);
    const rows = iso2 && byIso2All[iso2];
    if (!rows) { tooltip.classList.remove('show'); return; }
    const wasShown = tooltip.classList.contains('show') && tooltip.dataset.pinnedFor === iso2;
    if (wasShown) { tooltip.classList.remove('show'); return; }
    showLandTooltip(rows, e.clientX, e.clientY);
    tooltip.dataset.pinnedFor = iso2;
  };

  // Sentiment gauge — a semicircle from bearish (0) to bullish (100), positioned
  // by the share of tracked markets that are up today.
  const tracked = summary.tracked || 0;
  const score = tracked ? Math.round((summary.up || 0) / tracked * 100) : 50;
  const label = score >= 60 ? 'BULLISH' : score <= 40 ? 'BEARISH' : 'NEUTRAL';
  const labelColor = score >= 60 ? '#4ade80' : score <= 40 ? '#f87171' : '#eab308';
  const angle = -90 + (score / 100) * 180; // -90deg (bearish end) to +90deg (bullish end)
  const rad = angle * Math.PI / 180;
  const needleX = 60 + 46 * Math.sin(rad), needleY = 60 - 46 * Math.cos(rad);
  document.getElementById('pulseGaugeRow').innerHTML = `
    <svg width="120" height="70" viewBox="0 0 120 70">
      <path d="M 10 60 A 50 50 0 0 1 110 60" fill="none" stroke="url(#pulseGaugeGrad)" stroke-width="10" stroke-linecap="round"/>
      <defs><linearGradient id="pulseGaugeGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#f87171"/><stop offset="50%" stop-color="#eab308"/><stop offset="100%" stop-color="#4ade80"/>
      </linearGradient></defs>
      <line x1="60" y1="60" x2="${needleX}" y2="${needleY}" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="60" cy="60" r="4" fill="var(--text)"/>
    </svg>
    <div class="pulse-gauge-label">Market sentiment<div class="pulse-gauge-value" style="color:${labelColor};">${score} · ${label}</div></div>
  `;

  document.getElementById('pulseDetailLegend').innerHTML = PULSE_COUNTRY_BUCKETS.map(b =>
    `<span class="pulse-detail-legend-swatch"><span class="sw" style="background:${b.color};"></span>${esc(b.label)}</span>`
  ).join('') + `<span class="pulse-detail-legend-swatch"><span class="sw" style="background:#e0e0e0;"></span>No data</span>`;

  // A curated set of majors for the ticker strip, in a fixed reading order
  // rather than sorted by move — this is meant to be scanned like a real
  // exchange ticker, not another gainers/losers ranking (that's what the
  // leaderboard below the tabs is for). Several of these countries now track
  // 2 indices (US, UK, South Korea, Japan, China, India) — grouped into one
  // chip per country rather than picking just one, both so the card actually
  // reflects "this market has 2 major indices" and because picking only one
  // arbitrarily favored whichever happened to be listed first.
  const TICKER_COUNTRIES = ['United States', 'United Kingdom', 'South Korea', 'Japan', 'China', 'India', 'Germany', 'Australia'];
  document.getElementById('pulseTicker').innerHTML = TICKER_COUNTRIES.map(country => {
    const rows = markets.filter(m => m.country === country);
    if (!rows.length) return '';
    const indexLines = rows.map(m => `
      <div class="pulse-ticker-index">${esc(m.index)}</div>
      <div class="pulse-ticker-move ${m.pct_change >= 0 ? 'up' : 'down'}">${m.pct_change >= 0 ? '+' : ''}${m.pct_change.toFixed(2)}%</div>
    `).join('<div class="pulse-ticker-divider"></div>');
    return `
      <div class="pulse-ticker-chip">
        <div class="pulse-ticker-country">${esc(country)}</div>
        ${indexLines}
      </div>
    `;
  }).join('');
}

function gsrTimeAgo(iso) {
  if (!iso) return '';
  const ms = Date.now() - new Date(iso).getTime();
  const hrs = ms / 3600000;
  if (hrs < 1) return 'moments ago';
  if (hrs < 24) return `${Math.round(hrs)}h ago`;
  return `${Math.round(hrs / 24)}d ago`;
}

// Tilt is driven by how far today's ratio sits from the real historical average
// computed server-side, NOT the ratio's raw magnitude — a raw-magnitude tilt
// would look nearly identical every single day, since the ratio is always "a
// lot more silver than gold" (60-90ish). Anchoring "level" at the historical
// average instead turns the beam into an actual signal: it visibly reads as
// "richer/cheaper than normal today", and moves meaningfully as that changes.
// Capped at +/-16deg so an extreme reading still looks like a scale, not a
// cartwheel.
// Sign is negated: gold's pan is the left one (SVG x=78) and a positive
// rotate() is clockwise, which would lift the left pan and drop the right
// one. We want the opposite — when the ratio is above average (gold reading
// richer/more valuable than its historical norm) gold's pan should sink, so
// the raw value is flipped before the beam rotates.
const GSR_TILT_SCALE = 320;
const GSR_TILT_MAX = 16;
function gsrTilt(ratio, avg) {
  if (!ratio || !avg) return 0;
  const raw = -((ratio - avg) / avg) * GSR_TILT_SCALE;
  return Math.max(-GSR_TILT_MAX, Math.min(GSR_TILT_MAX, raw));
}

let gsrRefreshing = false;

// Click/tap-to-refresh: bypasses the passive 12h client interval and asks the
// server for a genuinely fresh read (?refresh=1 — see api_gold_silver_ratio_live,
// which still throttles the *actual* upstream fetch to once per 30s no matter how
// many visitors click, so this can't be used to hammer Yahoo). gsrRefreshing is a
// simple client-side debounce so a rapid double-click/tap doesn't fire two
// overlapping requests.
async function gsrRefreshClick() {
  if (gsrRefreshing) return;
  gsrRefreshing = true;
  const area = document.getElementById('gsrScaleArea');
  if (area) area.classList.add('gsr-refreshing');
  const updated = document.getElementById('gsrUpdated');
  if (updated) updated.textContent = 'Refreshing…';
  try {
    await fetchGoldSilverRatio(true);
  } finally {
    if (area) area.classList.remove('gsr-refreshing');
    gsrRefreshing = false;
  }
}

async function fetchGoldSilverRatio(force) {
  const updated = document.getElementById('gsrUpdated');
  try {
    const res = await fetch(`/api/dataviz/gold-silver-ratio/live${force ? '?refresh=1' : ''}`);
    const data = await res.json();
    if (data.ratio == null) throw new Error('no data');
    document.getElementById('gsrSilverOz').textContent = `${data.ratio.toFixed(1)} oz`;
    document.getElementById('gsrRatio').textContent = `${data.ratio.toFixed(1)} : 1`;
    const arm = document.getElementById('gsrArm');
    if (arm) arm.style.transform = `rotate(${gsrTilt(data.ratio, data.historical_average)}deg)`;
    const hist = document.getElementById('gsrHistorical');
    if (data.historical_average != null) {
      const cmp = data.ratio > data.historical_average ? 'above' : data.ratio < data.historical_average ? 'below' : 'right at';
      hist.innerHTML = `<strong>${cmp}</strong> its real historical average of <strong>${data.historical_average.toFixed(1)} : 1</strong>${data.historical_since ? ` (computed from daily data since ${esc(data.historical_since)})` : ''}`;
    } else {
      hist.textContent = 'Historical average unavailable right now.';
    }
    const ratioEl = document.getElementById('gsrStatRatio');
    ratioEl.textContent = `${data.ratio.toFixed(1)} : 1`;
    ratioEl.classList.remove('up', 'down');
    // "up"/"down" here follows Market Pulse's own green/red convention, repurposed:
    // green (up) = today's ratio reads cheaper than its historical norm, red (down)
    // = richer than normal — not a literal price gain/loss, but the same "which way
    // should I read this" visual shorthand the rest of the page already uses.
    if (data.historical_average != null) {
      ratioEl.classList.add(data.ratio < data.historical_average ? 'up' : data.ratio > data.historical_average ? 'down' : '');
    }
    document.getElementById('gsrStatAvg').textContent = data.historical_average != null ? `${data.historical_average.toFixed(1)} : 1` : '—';
    document.getElementById('gsrStatGold').textContent = `$${data.xau_usd.toLocaleString()}`;
    document.getElementById('gsrStatSilver').textContent = `$${data.xag_usd.toLocaleString()}`;
    updated.textContent = `Live · updated ${gsrTimeAgo(data.updated_at)}`;
  } catch {
    updated.textContent = "Couldn't load live prices — showing the last known values.";
  }
}

// (loaded above) — this used to duplicate it, which meant a tap fired
// BOTH listeners on the same chevron and the two toggles cancelled
// each other out: the chevron still visually flips (browsers apply a
// sticky :hover state after a tap on touch devices, which a separate
// CSS rule keys off), but the dropdown itself never opens.

  localStorage.setItem('gca-theme', next);

}
