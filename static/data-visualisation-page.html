<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Visualisation — Growth Capital Academy</title>
<link rel="icon" type="image/png" href="/static/logos/Green Square.png">
<script>
  var _t = localStorage.getItem('gca-theme') || 'light';
  localStorage.setItem('gca-theme', _t);
  document.documentElement.setAttribute('data-theme', _t);
</script>
<link rel="stylesheet" href="/static/css/site-nav.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
.page-hero { padding: 100px 5% 48px; text-align: center; position: relative; overflow: hidden; background: var(--bg); }
.page-hero::before { content: ''; position: absolute; top: -10%; left: 50%; transform: translateX(-50%); width: 800px; height: 500px; background: radial-gradient(ellipse, rgba(0,212,170,0.10) 0%, transparent 65%); pointer-events: none; }
.hero-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
.section-badge { display: inline-flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green); margin-bottom: 18px; opacity: 0.85; }
.section-badge::before { content: ''; display: block; width: 18px; height: 1px; background: var(--green); }
.hero-title { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: clamp(32px, 5vw, 52px); letter-spacing: -0.03em; line-height: 1.08; color: var(--text); margin-bottom: 16px; }
.hero-sub { font-size: clamp(15px, 1.6vw, 18px); color: var(--muted); max-width: 560px; margin: 0 auto; line-height: 1.6; }
.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); text-decoration: none; margin-bottom: 20px; }
.back-link:hover { color: var(--text); }
.content-section { padding: 0 5% 60px; }
.content-inner { max-width: 820px; margin: 0 auto; }

/* POSTS */
.posts-list { display: flex; flex-direction: column; gap: 28px; }
.list-empty { font-size: 14px; color: var(--muted); text-align: center; padding: 60px 20px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
.post-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 28px;
  position: relative; display: flex; flex-direction: column; gap: 16px;
}
.post-image { width: 100%; max-height: 360px; border-radius: 12px; object-fit: cover; display: block; }
.post-title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: clamp(20px, 2.2vw, 26px); color: var(--text); letter-spacing: -0.02em; }
.post-section-label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--green); margin-bottom: 6px; }
.post-body { font-size: 14.5px; color: var(--muted); line-height: 1.7; }
.post-warning { font-size: 13px; color: #b7791f; background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3); border-radius: 10px; padding: 12px 14px; line-height: 1.6; }
.post-link a { color: var(--green); font-size: 13.5px; font-weight: 600; text-decoration: none; }
.post-link a:hover { text-decoration: underline; }
.post-date {
  align-self: flex-end; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted);
  opacity: 0.75; margin-top: -4px;
}

/* MARKET PULSE — live heat map. Forced into dark mode (see initMarketPulse) to
   match the approved gold-on-navy mockup — the toggle is hidden on this page so
   that choice can't be undone by a stray click and end up looking half-finished. */
body.pulse-page .theme-toggle { display: none; }
body.pulse-page .section-badge, body.pulse-page .section-badge::before { color: #d4af6a; background: #d4af6a; }
.pulse-wrap { margin-bottom: 40px; }
.pulse-note {
  display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted);
  background: var(--card); border: 1px solid rgba(212,175,106,0.35); border-radius: 999px; padding: 8px 16px; margin-bottom: 22px;
}
.pulse-dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; animation: pulseDot 1.8s ease-in-out infinite; }
@keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.pulse-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
@media (max-width: 640px) { .pulse-stats { grid-template-columns: repeat(2, 1fr); } }
.pulse-stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 10px; text-align: center; }
.pulse-stat-value { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 26px; color: var(--text); }
.pulse-stat-value.up { color: #4ade80; }
.pulse-stat-value.down { color: #f87171; }
.pulse-stat-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.pulse-map-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
.pulse-map-svg { width: 100%; height: auto; display: block; }
.pulse-continent { fill: rgba(148,163,196,0.4); stroke: rgba(148,163,196,0.55); stroke-width: 3; vector-effect: non-scaling-stroke; }
.pulse-map-credit { text-align: right; font-size: 10.5px; color: var(--muted); opacity: 0.6; margin-top: 6px; }
.pulse-map-credit a { color: inherit; }
.pulse-market-dot { cursor: pointer; stroke: rgba(255,255,255,0.7); stroke-width: 4; vector-effect: non-scaling-stroke; transition: r 0.15s ease; }
.pulse-market-dot:hover { stroke-width: 8; }
.pulse-legend { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.pulse-legend-bar { width: 160px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #f87171, #8892b0, #4ade80); }
.pulse-tooltip {
  position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 12px; font-size: 12.5px; color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,0.25); z-index: 20;
  opacity: 0; transition: opacity 0.12s ease; white-space: nowrap;
}
.pulse-tooltip.show { opacity: 1; }
.pulse-tooltip .t-country { font-weight: 700; }
.pulse-tooltip .t-move { font-family: 'JetBrains Mono', monospace; }
.pulse-tooltip .t-move.up { color: #4ade80; }
.pulse-tooltip .t-move.down { color: #f87171; }
.pulse-leaders { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px; }
@media (max-width: 640px) { .pulse-leaders { grid-template-columns: 1fr; } }
.pulse-leader-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
.pulse-leader-title { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.pulse-leader-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 13.5px; color: var(--text); border-top: 1px solid var(--border); }
.pulse-leader-row:first-of-type { border-top: none; }
.pulse-leader-move { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
.pulse-leader-move.up { color: #4ade80; }
.pulse-leader-move.down { color: #f87171; }
.pulse-divider { border: none; border-top: 1px solid var(--border); margin: 0 0 40px; }

footer { border-top: 1px solid var(--border); padding: 48px 5%; margin-top: 40px; }
.footer-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
.footer-links { display: flex; gap: 28px; flex-wrap: wrap; }
.footer-links a { font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.2s; }
.footer-links a:hover { color: var(--text); }
.footer-copy { font-size: 12px; color: rgba(136,146,176,0.5); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<script src="/static/js/nav.js"></script>

<div class="page-hero">
  <div class="hero-grid"></div>
  <div style="position:relative;z-index:2;animation:fadeUp 0.7s 0.1s ease both;">
    <div class="section-badge">Data Visualisation</div>
    <h1 class="hero-title" id="pageTitle">—</h1>
    <p class="hero-sub">The latest updates for this visualisation, newest first.</p>
  </div>
</div>

<section class="content-section">
  <div class="content-inner">
    <a href="/tools/data-visualisation" class="back-link">← Back to all visualisations</a>
    <div id="pulseContainer"></div>
    <div class="posts-list" id="postsList">
      <div class="list-empty">Loading…</div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div><img id="footerLogo" src="/static/logos/Green Square.png" alt="Growth Capital Academy" style="height:40px;width:auto;border-radius:6px;"></div>
    <div class="footer-links">
      <a href="/learn">Learn</a>
      <a href="/tools/signals">Signals</a>
      <a href="/backtester">Backtester</a>
      <a href="/tools/portfolio">Portfolio</a>
      <a href="/tools/calculator">Calculator</a>
      <a href="/tools/data-visualisation">Data Visualisation</a>
      <a href="/arena">The Arena</a>
      <a href="/alpha">Alpha</a>
      <a href="/partners">Partners</a>
    </div>
    <div class="footer-copy">© 2026 Growth Capital Academy. All rights reserved.</div>
  </div>
</footer>

<script>
function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

const slug = window.location.pathname.split('/').filter(Boolean).pop();

async function loadPage() {
  const list = document.getElementById('postsList');
  try {
    const res = await fetch(`/api/dataviz/${encodeURIComponent(slug)}/content`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    document.getElementById('pageTitle').textContent = data.label || 'Data Visualisation';
    document.title = `${data.label || 'Data Visualisation'} — Growth Capital Academy`;
    const items = data.items || [];
    if (!items.length) {
      list.innerHTML = '<div class="list-empty">Nothing published here yet — check back soon. In the meantime, the live map above updates itself.</div>';
    } else {
      list.innerHTML = items.map(renderPost).join('');
    }
    if (slug === 'market-pulse') {
      document.querySelector('.hero-sub').textContent = "Every major index worldwide, colored by today's move — refreshes automatically. Commentary on the day's biggest movers below.";
      // This page's design (approved by Tom) is a fixed dark/gold dashboard look,
      // not the site's normal light/dark toggle — force dark and hide the toggle
      // (see the body.pulse-page rules above) so it can't be switched away by
      // mistake. Not persisted to localStorage, so it doesn't affect any other page.
      document.documentElement.setAttribute('data-theme', 'dark');
      document.body.classList.add('pulse-page');
      updateToggleIcon('dark'); updateLogos('dark');
      initMarketPulse();
    }
  } catch {
    list.innerHTML = '<div class="list-empty">This page couldn\'t be found.</div>';
  }
}

// ── Market Pulse — live global heat map ────────────────────────────────────
const PULSE_REFRESH_MS = 5 * 60 * 1000; // matches the server's own 5-min cache TTL
let pulseTimer = null;

function pulseColor(pct) {
  // Clamp to a +/-2% range so a couple of outliers don't wash out the rest of the map.
  const t = Math.max(-1, Math.min(1, pct / 2));
  const down = [248, 113, 113], mid = [136, 146, 176], up = [74, 222, 128];
  const [a, b] = t < 0 ? [mid, down] : [mid, up];
  const f = Math.abs(t);
  const rgb = a.map((c, i) => Math.round(c + (b[i] - c) * f));
  return `rgb(${rgb.join(',')})`;
}

// Map viewBox is 5760x2880 (see lonToX/latToY) — 5.76x the old 1000x500 box —
// so radii need the same scale-up to read at the same visual size on screen.
const PULSE_MAP_SCALE = 5.76;
function pulseRadius(pct) {
  return Math.min(11, 4 + Math.abs(pct) * 2.6) * PULSE_MAP_SCALE;
}

function initMarketPulse() {
  const wrap = document.getElementById('pulseContainer');
  wrap.innerHTML = `
    <div class="pulse-wrap">
      <div class="pulse-note"><span class="pulse-dot-live"></span><span id="pulseUpdated">Loading live prices…</span></div>
      <div class="pulse-stats" id="pulseStats"></div>
      <div class="pulse-map-card" style="position:relative;">
        <svg class="pulse-map-svg" id="pulseMapSvg" viewBox="0 0 5760 2880" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="pulse-tooltip" id="pulseTooltip"></div>
      </div>
      <div class="pulse-legend"><span>Down</span><div class="pulse-legend-bar"></div><span>Up</span></div>
      <div class="pulse-map-credit">Map: <a href="https://commons.wikimedia.org/wiki/File:Equirectangular_projection_world_map_without_borders.svg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY-SA 4.0</div>
    </div>
    <div class="pulse-leaders" id="pulseLeaders"></div>
    <hr class="pulse-divider">
  `;
  drawPulseContinents();
  fetchPulse();
  if (pulseTimer) clearInterval(pulseTimer);
  pulseTimer = setInterval(fetchPulse, PULSE_REFRESH_MS);
}

// Real land outline (Wikimedia Commons, CC BY-SA 4.0 — credited under the map)
// rather than stylized blobs. Its viewBox (0 0 5760 2880) is exactly an 8x scale
// of a 720x360 equirectangular projection, so lon/lat map onto it directly with
// no separate rescale, and dots drawn in the same coordinate space line up with
// real coastlines. Fetched once and cached — every redraw (each 5-min refresh)
// reuses the same path string instead of re-fetching it.
let _pulseLandPath = null;
function lonToX(lon) { return (lon + 180) / 360 * 5760; }
function latToY(lat) { return (90 - lat) / 180 * 2880; }

async function getPulseLandPath() {
  if (_pulseLandPath !== null) return _pulseLandPath;
  try {
    const res = await fetch('/static/img/world-map-outline.svg');
    const text = await res.text();
    const match = text.match(/<path[^>]*\sd="([^"]+)"/);
    _pulseLandPath = match ? match[1] : '';
  } catch {
    _pulseLandPath = '';
  }
  return _pulseLandPath;
}

async function drawPulseContinents() {
  const svg = document.getElementById('pulseMapSvg');
  const d = await getPulseLandPath();
  svg.innerHTML = d ? `<path class="pulse-continent" d="${d}"></path>` : '';
}

async function fetchPulse() {
  try {
    const res = await fetch('/api/dataviz/market-pulse/live');
    if (!res.ok) throw new Error();
    const data = await res.json();
    renderPulse(data);
  } catch {
    const el = document.getElementById('pulseUpdated');
    if (el) el.textContent = 'Live prices are temporarily unavailable — showing the last known snapshot.';
  }
}

async function renderPulse(data) {
  const { markets = [], summary = {}, updated_at } = data;

  const updatedEl = document.getElementById('pulseUpdated');
  if (updatedEl && updated_at) {
    const d = new Date(updated_at);
    updatedEl.textContent = `Live · updated ${d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`;
  }

  document.getElementById('pulseStats').innerHTML = `
    <div class="pulse-stat"><div class="pulse-stat-value">${summary.tracked ?? 0}</div><div class="pulse-stat-label">Markets tracked</div></div>
    <div class="pulse-stat"><div class="pulse-stat-value up">${summary.up ?? 0}</div><div class="pulse-stat-label">Up today</div></div>
    <div class="pulse-stat"><div class="pulse-stat-value down">${summary.down ?? 0}</div><div class="pulse-stat-label">Down today</div></div>
    <div class="pulse-stat"><div class="pulse-stat-value ${(summary.avg_move||0) >= 0 ? 'up' : 'down'}">${(summary.avg_move||0) >= 0 ? '+' : ''}${(summary.avg_move ?? 0).toFixed(2)}%</div><div class="pulse-stat-label">Avg move</div></div>
  `;

  const svg = document.getElementById('pulseMapSvg');
  const tooltip = document.getElementById('pulseTooltip');
  await drawPulseContinents();
  const dotsHtml = markets.map(m => {
    const x = lonToX(m.lon), y = latToY(m.lat);
    return `<circle class="pulse-market-dot" cx="${x}" cy="${y}" r="${pulseRadius(m.pct_change)}" fill="${pulseColor(m.pct_change)}" data-country="${esc(m.country)}" data-index="${esc(m.index)}" data-pct="${m.pct_change}" data-price="${m.price}"></circle>`;
  }).join('');
  svg.insertAdjacentHTML('beforeend', dotsHtml);

  svg.querySelectorAll('.pulse-market-dot').forEach(dot => {
    dot.addEventListener('mousemove', e => {
      const pct = parseFloat(dot.dataset.pct);
      const sign = pct >= 0 ? '+' : '';
      tooltip.innerHTML = `<div class="t-country">${esc(dot.dataset.country)}</div><div>${esc(dot.dataset.index)} · ${dot.dataset.price}</div><div class="t-move ${pct >= 0 ? 'up' : 'down'}">${sign}${pct.toFixed(2)}%</div>`;
      const cardRect = svg.closest('.pulse-map-card').getBoundingClientRect();
      tooltip.style.left = `${e.clientX - cardRect.left + 14}px`;
      tooltip.style.top = `${e.clientY - cardRect.top + 14}px`;
      tooltip.classList.add('show');
    });
    dot.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
  });

  const sorted = [...markets].sort((a, b) => b.pct_change - a.pct_change);
  const gainers = sorted.slice(0, 3);
  const losers = sorted.slice(-3).reverse();
  const leaderRow = m => `<div class="pulse-leader-row"><span>${esc(m.country)} <span style="color:var(--muted);">· ${esc(m.index)}</span></span><span class="pulse-leader-move ${m.pct_change >= 0 ? 'up' : 'down'}">${m.pct_change >= 0 ? '+' : ''}${m.pct_change.toFixed(2)}%</span></div>`;
  document.getElementById('pulseLeaders').innerHTML = `
    <div class="pulse-leader-card"><div class="pulse-leader-title">Top gainers</div>${gainers.map(leaderRow).join('') || '<div class="pulse-leader-row">—</div>'}</div>
    <div class="pulse-leader-card"><div class="pulse-leader-title">Top losers</div>${losers.map(leaderRow).join('') || '<div class="pulse-leader-row">—</div>'}</div>
  `;
}

function renderPost(item) {
  const imageTag = item.image_url ? `<img class="post-image" src="${esc(item.image_url)}" alt="">` : '';
  const linkTag = item.link ? `<div class="post-link"><a href="${esc(item.link)}" target="_blank" rel="noopener">Further information →</a></div>` : '';
  const warningTag = item.warning ? `<div class="post-warning"><strong>Accuracy / usefulness note:</strong> ${esc(item.warning)}</div>` : '';
  return `
    <article class="post-card">
      ${imageTag}
      <div>
        <div class="post-title">${esc(item.title) || 'Untitled'}</div>
        ${item.description ? `<div class="post-body">${esc(item.description)}</div>` : ''}
      </div>
      ${item.positive_analysis ? `<div><div class="post-section-label">Why it's useful</div><div class="post-body">${esc(item.positive_analysis)}</div></div>` : ''}
      ${warningTag}
      ${linkTag}
      <div class="post-date">${formatDate(item.published_at)}</div>
    </article>
  `;
}

loadPage();

function updateLogos(theme) {
}
function toggleMobileNav() {
  const links = document.querySelector('.nav-links');
  const btn = document.getElementById('navHamburger');
  const isOpen = links.classList.toggle('open');
  btn.classList.toggle('active', isOpen);
  btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}
// Mobile dropdown-chevron toggling now lives in /static/js/nav.js
// (loaded above) — this used to duplicate it, which meant a tap fired
// BOTH listeners on the same chevron and the two toggles cancelled
// each other out: the chevron still visually flips (browsers apply a
// sticky :hover state after a tap on touch devices, which a separate
// CSS rule keys off), but the dropdown itself never opens.
window.addEventListener('resize', () => {
  if (window.innerWidth > 900) {
    document.querySelector('.nav-links').classList.remove('open');
    document.getElementById('navHamburger').classList.remove('active');
    document.querySelectorAll('.has-dropdown.open').forEach(li => li.classList.remove('open'));
  }
});
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('gca-theme', next);
  updateToggleIcon(next); updateLogos(next);
}
function updateToggleIcon(theme) {
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = theme === 'light' ? '🌙' : '☀️';
}
const _initialTheme = document.documentElement.getAttribute('data-theme') || 'light';
updateToggleIcon(_initialTheme); updateLogos(_initialTheme);
const nav = document.querySelector('nav');
window.addEventListener('scroll', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  nav.style.background = window.scrollY > 40
    ? (isDark ? 'rgba(6,8,18,0.96)' : 'rgba(245,247,255,0.96)')
    : (isDark ? 'rgba(6,8,18,0.82)' : 'rgba(245,247,255,0.88)');
});
(async function checkAuth() {
  try {
    const res = await fetch('/api/me', { credentials: 'include' });
    if (res.ok) {
      const data = await res.json();
      if (data.authenticated && data.username) {
        const signIn = document.getElementById('navSignIn');
        if (signIn) { signIn.textContent = data.username; signIn.href = '/profile'; signIn.style.color = 'var(--green)'; signIn.style.borderColor = 'var(--green)'; }
        if (data.alpha_role) {
          const studioLink = document.getElementById('navStudioLi');
          if (studioLink) studioLink.style.display = '';
          if (['tom', 'gary'].includes(data.alpha_role)) {
            const datavizStudioLi = document.getElementById('navDatavizStudioLi');
            if (datavizStudioLi) datavizStudioLi.style.display = '';
          }
        }
      }
    }
  } catch {}
})();
</script>
</body>
