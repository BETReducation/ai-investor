<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Visualisation — Growth Capital Academy</title>
<link rel="icon" type="image/png" href="/static/logos/Green Square.png">
<script>
  var _t = localStorage.getItem('gca-theme') || 'light';
  localStorage.setItem('gca-theme', _t);
  document.documentElement.setAttribute('data-theme', _t);
</script>
<link rel="stylesheet" href="/static/css/site-nav.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
.page-hero { padding: 100px 5% 48px; text-align: center; position: relative; overflow: hidden; background: var(--bg); }
.page-hero::before { content: ''; position: absolute; top: -10%; left: 50%; transform: translateX(-50%); width: 800px; height: 500px; background: radial-gradient(ellipse, rgba(0,212,170,0.10) 0%, transparent 65%); pointer-events: none; }
.hero-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
.section-badge { display: inline-flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green); margin-bottom: 18px; opacity: 0.85; }
.section-badge::before { content: ''; display: block; width: 18px; height: 1px; background: var(--green); }
.hero-title { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: clamp(32px, 5vw, 52px); letter-spacing: -0.03em; line-height: 1.08; color: var(--text); margin-bottom: 16px; }
.hero-sub { font-size: clamp(15px, 1.6vw, 18px); color: var(--muted); max-width: 560px; margin: 0 auto; line-height: 1.6; }
.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); text-decoration: none; margin-bottom: 20px; }
.back-link:hover { color: var(--text); }
.content-section { padding: 0 5% 60px; }
.content-inner { max-width: 820px; margin: 0 auto; }

/* POSTS */
.posts-list { display: flex; flex-direction: column; gap: 28px; }
.list-empty { font-size: 14px; color: var(--muted); text-align: center; padding: 60px 20px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
.post-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 28px;
  position: relative; display: flex; flex-direction: column; gap: 16px;
}
.post-image { width: 100%; max-height: 360px; border-radius: 12px; object-fit: cover; display: block; }
.post-title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: clamp(20px, 2.2vw, 26px); color: var(--text); letter-spacing: -0.02em; }
.post-section-label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--green); margin-bottom: 6px; }
.post-body { font-size: 14.5px; color: var(--muted); line-height: 1.7; }
.post-warning { font-size: 13px; color: #b7791f; background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3); border-radius: 10px; padding: 12px 14px; line-height: 1.6; }
.post-link a { color: var(--green); font-size: 13.5px; font-weight: 600; text-decoration: none; }
.post-link a:hover { text-decoration: underline; }
.post-date {
  align-self: flex-end; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted);
  opacity: 0.75; margin-top: -4px;
}

footer { border-top: 1px solid var(--border); padding: 48px 5%; margin-top: 40px; }
.footer-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
.footer-links { display: flex; gap: 28px; flex-wrap: wrap; }
.footer-links a { font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.2s; }
.footer-links a:hover { color: var(--text); }
.footer-copy { font-size: 12px; color: rgba(136,146,176,0.5); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<script src="/static/js/nav.js"></script>

<div class="page-hero">
  <div class="hero-grid"></div>
  <div style="position:relative;z-index:2;animation:fadeUp 0.7s 0.1s ease both;">
    <div class="section-badge">Data Visualisation</div>
    <h1 class="hero-title" id="pageTitle">—</h1>
    <p class="hero-sub">The latest updates for this visualisation, newest first.</p>
  </div>
</div>

<section class="content-section">
  <div class="content-inner">
    <a href="/tools/data-visualisation" class="back-link">← Back to all visualisations</a>
    <div class="posts-list" id="postsList">
      <div class="list-empty">Loading…</div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div><img id="footerLogo" src="/static/logos/Green Square.png" alt="Growth Capital Academy" style="height:40px;width:auto;border-radius:6px;"></div>
    <div class="footer-links">
      <a href="/learn">Learn</a>
      <a href="/tools/signals">Signals</a>
      <a href="/backtester">Backtester</a>
      <a href="/tools/portfolio">Portfolio</a>
      <a href="/tools/calculator">Calculator</a>
      <a href="/tools/data-visualisation">Data Visualisation</a>
      <a href="/arena">The Arena</a>
      <a href="/alpha">Alpha</a>
      <a href="/partners">Partners</a>
    </div>
    <div class="footer-copy">© 2026 Growth Capital Academy. All rights reserved.</div>
  </div>
</footer>

<script>
function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

const slug = window.location.pathname.split('/').filter(Boolean).pop();

async function loadPage() {
  const list = document.getElementById('postsList');
  try {
    const res = await fetch(`/api/dataviz/${encodeURIComponent(slug)}/content`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    document.getElementById('pageTitle').textContent = data.label || 'Data Visualisation';
    document.title = `${data.label || 'Data Visualisation'} — Growth Capital Academy`;
    const items = data.items || [];
    if (!items.length) {
      list.innerHTML = '<div class="list-empty">Nothing published here yet — check back soon.</div>';
      return;
    }
    list.innerHTML = items.map(renderPost).join('');
  } catch {
    list.innerHTML = '<div class="list-empty">This page couldn\'t be found.</div>';
  }
}

function renderPost(item) {
  const imageTag = item.image_url ? `<img class="post-image" src="${esc(item.image_url)}" alt="">` : '';
  const linkTag = item.link ? `<div class="post-link"><a href="${esc(item.link)}" target="_blank" rel="noopener">Further information →</a></div>` : '';
  const warningTag = item.warning ? `<div class="post-warning"><strong>Accuracy / usefulness note:</strong> ${esc(item.warning)}</div>` : '';
  return `
    <article class="post-card">
      ${imageTag}
      <div>
        <div class="post-title">${esc(item.title) || 'Untitled'}</div>
        ${item.description ? `<div class="post-body">${esc(item.description)}</div>` : ''}
      </div>
      ${item.positive_analysis ? `<div><div class="post-section-label">Why it's useful</div><div class="post-body">${esc(item.positive_analysis)}</div></div>` : ''}
      ${warningTag}
      ${linkTag}
      <div class="post-date">${formatDate(item.published_at)}</div>
    </article>
  `;
}

loadPage();

function updateLogos(theme) {
}
function toggleMobileNav() {
  const links = document.querySelector('.nav-links');
  const btn = document.getElementById('navHamburger');
  const isOpen = links.classList.toggle('open');
  btn.classList.toggle('active', isOpen);
  btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}
// Mobile dropdown-chevron toggling now lives in /static/js/nav.js
// (loaded above) — this used to duplicate it, which meant a tap fired
// BOTH listeners on the same chevron and the two toggles cancelled
// each other out: the chevron still visually flips (browsers apply a
// sticky :hover state after a tap on touch devices, which a separate
// CSS rule keys off), but the dropdown itself never opens.
window.addEventListener('resize', () => {
  if (window.innerWidth > 900) {
    document.querySelector('.nav-links').classList.remove('open');
    document.getElementById('navHamburger').classList.remove('active');
    document.querySelectorAll('.has-dropdown.open').forEach(li => li.classList.remove('open'));
  }
});
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('gca-theme', next);
  updateToggleIcon(next); updateLogos(next);
}
function updateToggleIcon(theme) {
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = theme === 'light' ? '🌙' : '☀️';
}
const _initialTheme = document.documentElement.getAttribute('data-theme') || 'light';
updateToggleIcon(_initialTheme); updateLogos(_initialTheme);
const nav = document.querySelector('nav');
window.addEventListener('scroll', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  nav.style.background = window.scrollY > 40
    ? (isDark ? 'rgba(6,8,18,0.96)' : 'rgba(245,247,255,0.96)')
    : (isDark ? 'rgba(6,8,18,0.82)' : 'rgba(245,247,255,0.88)');
});
(async function checkAuth() {
  try {
    const res = await fetch('/api/me', { credentials: 'include' });
    if (res.ok) {
      const data = await res.json();
      if (data.authenticated && data.username) {
        const signIn = document.getElementById('navSignIn');
        if (signIn) { signIn.textContent = data.username; signIn.href = '/profile'; signIn.style.color = 'var(--green)'; signIn.style.borderColor = 'var(--green)'; }
        if (data.alpha_role) {
          const studioLink = document.getElementById('navStudioLi');
          if (studioLink) studioLink.style.display = '';
          if (['tom', 'gary'].includes(data.alpha_role)) {
            const datavizStudioLi = document.getElementById('navDatavizStudioLi');
            if (datavizStudioLi) datavizStudioLi.style.display = '';
          }
        }
      }
    }
  } catch {}
})();
</script>
</body>
</html>
