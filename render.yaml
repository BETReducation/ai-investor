services:
  - type: web
    name: ai-investor
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 16 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: ai-investor-db
          property: connectionString
      # Secrets: set in the Render dashboard (sync: false keeps them out of git)
      - { key: SECRET_KEY, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: ALPACA_API_KEY, sync: false }
      - { key: ALPACA_API_SECRET, sync: false }
      - { key: OANDA_ACCOUNT_ID, sync: false }
      - { key: OANDA_API_TOKEN, sync: false }
      - { key: OANDA_ENVIRONMENT, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: RESEND_FROM, sync: false }
      - { key: RESEND_FROM_ALERTS, sync: false }
      - { key: RESEND_FROM_RESET, sync: false }
      - { key: X_IDEAS_TOKEN, sync: false }

databases:
  - name: ai-investor-db
    plan: basic-256mb
    diskSizeGB: 5
